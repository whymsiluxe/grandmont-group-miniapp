name: GitHub Actions Node 24 cleanup

on:
  push:
    branches:
      - cleanup/actions-node24

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: ci-dummy-token-not-a-real-secret
      MINIAPP_DATA_ROOT: /tmp/ci-miniapp-data
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install system dependency
        run: sudo apt-get update && sudo apt-get install -y libmagic1

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Apply exact workflow upgrade
        run: python scripts/actions_node24_cleanup.py

      - name: Compile Python
        run: python -m py_compile backend/*.py backend/core/*.py backend/routes/*.py tests/*.py

      - name: Run full test suite
        run: cd tests && python -m pytest . -q -rs

      - name: Validate workflow action majors
        run: |
          ! grep -R "actions/checkout@v4\|actions/setup-python@v5" .github/workflows --include='*.yml'
          grep -R "actions/checkout@v7" .github/workflows --include='*.yml'
          grep -R "actions/setup-python@v7" .github/workflows --include='*.yml'

      - name: Commit clean result
        run: |
          rm scripts/actions_node24_cleanup.py .github/workflows/actions-node24-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: upgrade official actions to Node 24 majors"
          git push origin HEAD:cleanup/actions-node24
