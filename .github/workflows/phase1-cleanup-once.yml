name: Phase 1.1 cleanup

on:
  push:
    branches:
      - refactor/main-monolith-phase-1
    paths:
      - .github/workflows/phase1-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/main-monolith-phase-1
          fetch-depth: 0
      - name: Apply reviewed cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('backend/main.py')
          text = main.read_text()
          text = text.replace(
              '        compat_load_abwesenheit=lambda: _load_abwesenheit(),\n'
              '        compat_auto_close=lambda: _auto_close_expired_open_ended_abwesenheit(),\n',
              ''
          )
          main.write_text(text)

          tools = Path('backend/routes/tools.py')
          text = tools.read_text()
          text = text.replace('from types import SimpleNamespace\n', '')
          marker = '    tool_bookings_file: Callable[[], str]\n\n\n'
          handlers = '''    tool_bookings_file: Callable[[], str]\n\n\n@dataclass(frozen=True)\nclass ToolsHandlers:\n    list_tools: Callable[..., dict]\n    tool_history: Callable[..., dict]\n    list_tool_bookings: Callable[..., dict]\n    create_tool_booking: Callable[..., dict]\n    cancel_tool_booking: Callable[..., dict]\n    checkout_tool: Callable[..., dict]\n    return_tool: Callable[..., dict]\n    update_tool: Callable[..., dict]\n    create_tool: Callable[..., dict]\n    active_tool_booking_conflict: Callable[..., Any]\n\n\n'''
          if marker not in text:
              raise SystemExit('ToolsRouteDeps insertion marker not found')
          text = text.replace(marker, handlers, 1)
          text = text.replace(
              'def create_tools_router(deps: ToolsRouteDeps):',
              'def create_tools_router(deps: ToolsRouteDeps) -> tuple[APIRouter, ToolsHandlers]:'
          )
          text = text.replace('    handlers = SimpleNamespace(\n', '    handlers = ToolsHandlers(\n')
          tools.write_text(text)

          workforce = Path('tests/test_core_workforce_shadow.py')
          text = workforce.read_text()
          old = '''        source = inspect.getsource(backend.create_abwesenheit)\n        assert 'shadow_create_absence' in source\n        tree = ast.parse(source)\n        found_try_guard = any(\n            isinstance(node, ast.Try) and 'shadow_create_absence' in ast.dump(node)\n            for node in ast.walk(tree)\n        )\n        assert found_try_guard, "shadow_create_absence call must be wrapped in try/except in create_abwesenheit"'''
          new = '''        route = next(\n            route for route in backend.app.routes\n            if getattr(route, 'path', None) == '/api/abwesenheit'\n            and 'POST' in getattr(route, 'methods', set())\n        )\n        assert route.endpoint is backend.create_abwesenheit\n        source = inspect.getsource(route.endpoint)\n        assert 'shadow_create_absence' in source\n        tree = ast.parse(source)\n        found_try_guard = any(\n            isinstance(node, ast.Try) and 'shadow_create_absence' in ast.dump(node)\n            for node in ast.walk(tree)\n        )\n        assert found_try_guard, "registered create_abwesenheit route must guard shadow_create_absence"'''
          if old not in text:
              raise SystemExit('workforce test block not found')
          workforce.write_text(text.replace(old, new, 1))

          identity = Path('tests/test_identity_display_name_resolution.py')
          text = identity.read_text()
          text = text.replace("'date_from': '2026-09-22', 'date_to': '2026-09-23',", "'date_from': '2099-09-22', 'date_to': '2099-09-23',")
          text = text.replace(
              "with patch.object(backend, '_load_worker_profiles', return_value={WORKER_ID: {'name': 'Лох'}}), \\\n             patch.object(backend, '_auto_close_expired_open_ended_abwesenheit'):\n",
              "with patch.object(backend, '_load_worker_profiles', return_value={WORKER_ID: {'name': 'Лох'}}):\n"
          )
          identity.write_text(text)

          contract = Path('tests/test_phase1_route_contract.py')
          contract.write_text('''"""Contract guard for domains extracted from backend/main.py in Phase 1."""\nimport os\nimport sys\n\nsys.path.insert(0, os.path.join(os.path.dirname(__file__), '..', 'backend'))\n\nimport main as backend  # noqa: E402\n\n\ndef _route(path: str, method: str):\n    matches = [\n        route for route in backend.app.routes\n        if getattr(route, 'path', None) == path\n        and method in getattr(route, 'methods', set())\n    ]\n    assert len(matches) == 1, f"expected exactly one {method} {path}, got {len(matches)}"\n    return matches[0]\n\n\ndef _dependency_calls(route):\n    return {dependency.call for dependency in route.dependant.dependencies}\n\n\nROUTES = [\n    ('GET', '/api/tools', 'list_tools', ('user',)),\n    ('GET', '/api/tools/{serial}/history', 'tool_history', ('user',)),\n    ('GET', '/api/tools/bookings', 'list_tool_bookings', ('user',)),\n    ('POST', '/api/tools/{serial}/bookings', 'create_tool_booking', ('user', 'role')),\n    ('DELETE', '/api/tools/{serial}/bookings/{booking_id}', 'cancel_tool_booking', ('user', 'role')),\n    ('PATCH', '/api/tools/{serial}/checkout', 'checkout_tool', ('user',)),\n    ('PATCH', '/api/tools/{serial}/return', 'return_tool', ('user', 'role')),\n    ('PATCH', '/api/tools/{serial}', 'update_tool', ('user', 'owner')),\n    ('POST', '/api/tools', 'create_tool', ('user', 'owner')),\n    ('POST', '/api/abwesenheit', 'create_abwesenheit', ('user',)),\n    ('PATCH', '/api/abwesenheit/{entry_id}/close', 'close_abwesenheit', ('user', 'role')),\n    ('PATCH', '/api/abwesenheit/{entry_id}/status', 'update_abwesenheit_status', ('user', 'owner')),\n    ('PATCH', '/api/abwesenheit/{entry_id}', 'update_abwesenheit_dates', ('user', 'role')),\n    ('GET', '/api/abwesenheit', 'list_my_abwesenheit', ('user',)),\n    ('GET', '/api/abwesenheit/all', 'list_all_abwesenheit', ('user', 'role')),\n    ('DELETE', '/api/abwesenheit/{entry_id}', 'delete_abwesenheit', ('user', 'role')),\n]\n\n\ndef test_phase1_routes_keep_method_path_name_handler_and_auth_contract():\n    dependency_map = {\n        'user': backend.get_current_user,\n        'role': backend.get_role,\n        'owner': backend.require_owner,\n    }\n    for method, path, handler_name, dependency_keys in ROUTES:\n        route = _route(path, method)\n        handler = getattr(backend, handler_name)\n        assert route.endpoint is handler\n        assert route.name == handler_name\n        actual_dependencies = _dependency_calls(route)\n        expected_dependencies = {dependency_map[key] for key in dependency_keys}\n        assert expected_dependencies <= actual_dependencies, (\n            method, path, expected_dependencies, actual_dependencies\n        )\n\n\ndef test_phase1_routes_have_no_duplicate_method_path_pairs():\n    extracted = {(method, path) for method, path, *_ in ROUTES}\n    seen = {}\n    for route in backend.app.routes:\n        path = getattr(route, 'path', None)\n        for method in getattr(route, 'methods', set()):\n            key = (method, path)\n            if key in extracted:\n                seen[key] = seen.get(key, 0) + 1\n    assert seen == {key: 1 for key in extracted}\n''')

          workflow = Path('.github/workflows/phase1-cleanup-once.yml')
          workflow.unlink()
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: harden phase 1 domain boundaries"
          git push origin HEAD:refactor/main-monolith-phase-1
