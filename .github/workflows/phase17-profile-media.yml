name: Phase 17 profile media hardening

on:
  push:
    branches:
      - fix/profile-media-phase-17
    paths:
      - .github/workflows/phase17-profile-media.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/profile-media-phase-17
      - name: Harden avatar and defect media
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/routes/workforce_profiles.py')
          text = path.read_text()
          text = text.replace('import time\n', 'import time\nimport uuid\n', 1)
          marker = 'from pydantic import BaseModel\n\n\nclass SkillV2Body'
          replacement = """from pydantic import BaseModel\n\ntry:\n    from ..core.media_paths import resolve_owned_media_path\nexcept ImportError:\n    from core.media_paths import resolve_owned_media_path  # noqa: E402\n\n\nclass SkillV2Body"""
          assert marker in text
          text = text.replace(marker, replacement, 1)

          old = """        avatar_dir = deps.avatar_dir()\n        os.makedirs(avatar_dir, exist_ok=True)\n        for filename in os.listdir(avatar_dir):\n            if filename.startswith(uid + '.'):\n                os.remove(os.path.join(avatar_dir, filename))\n        with open(os.path.join(avatar_dir, f'{uid}.{ext}'), 'wb') as handle:\n            handle.write(raw)\n\n        def _mutator(profiles):\n            profile = profiles.get(uid, {\"skills\": [], \"quiz_completed\": False})\n            profile['avatar'] = True\n            if not profile.get('name'):\n                profile['name'] = user.get('first_name', uid)\n            profiles[uid] = profile\n\n        deps.update_json_transaction(deps.worker_profiles_file(), {}, _mutator)\n        return {'status': 'ok'}\n"""
          new = """        avatar_dir = deps.avatar_dir()\n        os.makedirs(avatar_dir, exist_ok=True)\n        prior_paths = [\n            os.path.join(avatar_dir, f'{uid}.{candidate_ext}')\n            for candidate_ext in ('jpg', 'png', 'webp')\n            if os.path.lexists(os.path.join(avatar_dir, f'{uid}.{candidate_ext}'))\n        ]\n        target_path = os.path.join(avatar_dir, f'{uid}.{ext}')\n        rollback_path = None\n        if os.path.lexists(target_path):\n            rollback_path = f'{target_path}.rollback-{uuid.uuid4().hex}'\n            os.replace(target_path, rollback_path)\n\n        try:\n            with open(target_path, 'wb') as handle:\n                handle.write(raw)\n\n            def _mutator(profiles):\n                profile = profiles.get(uid, {\"skills\": [], \"quiz_completed\": False})\n                profile['avatar'] = True\n                if not profile.get('name'):\n                    profile['name'] = user.get('first_name', uid)\n                profiles[uid] = profile\n\n            deps.update_json_transaction(deps.worker_profiles_file(), {}, _mutator)\n        except Exception:\n            try:\n                os.remove(target_path)\n            except FileNotFoundError:\n                pass\n            if rollback_path and os.path.lexists(rollback_path):\n                os.replace(rollback_path, target_path)\n            raise\n\n        if rollback_path:\n            try:\n                os.remove(rollback_path)\n            except FileNotFoundError:\n                pass\n        for old_path in prior_paths:\n            if old_path == target_path:\n                continue\n            try:\n                os.remove(old_path)\n            except FileNotFoundError:\n                pass\n        return {'status': 'ok'}\n"""
          assert old in text
          text = text.replace(old, new, 1)

          old = """        for ext in ('jpg', 'png', 'webp'):\n            path = os.path.join(deps.avatar_dir(), f'{user_id}.{ext}')\n            if os.path.exists(path):\n                return FileResponse(path)\n"""
          new = """        for ext in ('jpg', 'png', 'webp'):\n            path = resolve_owned_media_path(deps.avatar_dir(), f'{user_id}.{ext}')\n            if path and os.path.exists(path):\n                return FileResponse(path)\n"""
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path('backend/routes/mangel.py')
          text = path.read_text()
          marker = 'from starlette.responses import FileResponse\n\nlogger = logging.getLogger(__name__)'
          replacement = """from starlette.responses import FileResponse\n\ntry:\n    from ..core.media_paths import resolve_owned_media_path\nexcept ImportError:\n    from core.media_paths import resolve_owned_media_path  # noqa: E402\n\nlogger = logging.getLogger(__name__)"""
          assert marker in text
          text = text.replace(marker, replacement, 1)
          old = """        path = os.path.join(deps.photo_dir(), safe_name)\n        if not os.path.exists(path):\n            raise HTTPException(404, \"Файл отсутствует\")\n        return FileResponse(path)\n"""
          new = """        path = resolve_owned_media_path(deps.photo_dir(), safe_name)\n        if not path or not os.path.exists(path):\n            raise HTTPException(404, \"Файл отсутствует\")\n        return FileResponse(path)\n"""
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          python -m py_compile backend/routes/workforce_profiles.py backend/routes/mangel.py
      - name: Remove one-shot workflow
        run: rm .github/workflows/phase17-profile-media.yml
      - name: Commit hardening
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/routes/workforce_profiles.py backend/routes/mangel.py .github/workflows/phase17-profile-media.yml
          git commit -m 'Harden profile and defect media persistence [phase17]'
          git push origin HEAD:fix/profile-media-phase-17
