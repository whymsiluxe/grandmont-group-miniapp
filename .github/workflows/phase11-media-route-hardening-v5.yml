name: Phase 11 checkin media route hardening v5

on:
  push:
    branches:
      - refactor/checkin-service-phase-11

permissions:
  contents: write

jobs:
  harden:
    if: contains(github.event.head_commit.message, '[phase11-media-route-hardening-v5]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/checkin-service-phase-11
          fetch-depth: 0
      - name: Harden check-in photo route and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path('backend/routes/checkin.py')
          src = path.read_text()

          pkg_line = '    from .. import daily_plan_lib as dpl\n'
          flat_line = '    import daily_plan_lib as dpl  # noqa: E402\n'
          if pkg_line not in src or flat_line not in src:
              raise SystemExit('daily plan import lines not found')
          src = src.replace(pkg_line, pkg_line + '    from ..core.media_paths import resolve_owned_media_path\n', 1)
          src = src.replace(flat_line, flat_line + '    from core.media_paths import resolve_owned_media_path  # noqa: E402\n', 1)

          start = src.index("        key = 'start_photos' if which == 'start' else 'finish_photos'")
          end = src.index('\n\n    handlers = SimpleNamespace(', start)
          block = textwrap.dedent('''
          if which not in {'start', 'finish'}:
              raise HTTPException(404, "Фото не найдено")
          key = 'start_photos' if which == 'start' else 'finish_photos'
          photos = session.get(key, [])
          if not isinstance(photos, list) or index < 0 or index >= len(photos):
              raise HTTPException(404, "Фото не найдено")
          path = resolve_owned_media_path(deps.checkin_photo_base(), photos[index])
          if not path or not os.path.isfile(path):
              raise HTTPException(404, "Файл отсутствует")
          return FileResponse(path)
          ''').strip()
          src = src[:start] + textwrap.indent(block, '        ') + src[end:]
          path.write_text(src)
          PY
          python -m py_compile backend/routes/checkin.py backend/core/media_paths.py backend/core/checkin_support.py tests/test_checkin_media_paths_phase11.py
          rm -f .github/workflows/phase11-media-route-hardening*.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/routes/checkin.py .github/workflows/
          git commit -m "Contain check-in photo reads inside media root [phase11]"
          git push origin HEAD:refactor/checkin-service-phase-11
