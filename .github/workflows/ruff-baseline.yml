name: Ruff correctness cleanup

on:
  push:
    branches:
      - cleanup/ruff-guard

permissions:
  contents: write

jobs:
  ruff-cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: ci-dummy-token-not-a-real-secret
      MINIAPP_DATA_ROOT: /tmp/ci-miniapp-data
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libmagic1
          pip install -r requirements-test.txt
          pip install ruff==0.17.0
      - name: Apply exact correctness cleanup
        run: python scripts/ruff_correctness_cleanup.py
      - name: Ruff correctness check
        run: ruff check backend/core backend/routes --select F --output-format concise
      - name: Compile Python
        run: python -m py_compile backend/*.py backend/core/*.py backend/routes/*.py tests/*.py
      - name: Run full test suite
        run: cd tests && python -m pytest . -q -rs
      - name: Commit source cleanup only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/core/storage.py backend/core/workforce_shadow.py backend/routes/contracts.py backend/routes/daily_plan.py backend/routes/feed_news.py backend/routes/objects.py
          git commit -m "cleanup: fix extracted-module Ruff correctness issues"
          git push origin HEAD:cleanup/ruff-guard
