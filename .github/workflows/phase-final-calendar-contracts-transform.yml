name: Phase final calendar contracts transform
on:
  push:
    branches: [refactor/main-monolith-phase-6]
    paths:
      - 'scripts/phase-final-extract-calendar-contracts.py'
      - 'backend/routes/worker_calendar.py'
      - 'backend/routes/contracts.py'
      - 'backend/core/checkin_support.py'
      - 'tests/test_checkin_execution_routes_extraction.py'
      - '.github/workflows/phase-final-calendar-contracts-transform.yml'
permissions:
  contents: write
jobs:
  transform:
    runs-on: ubuntu-24.04
    env:
      BOT_TOKEN: ci-dummy-token-not-a-real-secret
      MINIAPP_DATA_ROOT: /tmp/ci-miniapp-data
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/main-monolith-phase-6
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1
          pip install -r requirements-test.txt
      - name: Apply guarded transform
        run: |
          python scripts/phase-final-extract-calendar-contracts.py
          python -m py_compile backend/*.py backend/core/*.py backend/routes/*.py tests/*.py
          echo "main.py lines after transform: $(wc -l < backend/main.py)"
      - name: Full Python regression suite
        run: cd tests && python -m pytest . -q
      - name: Commit clean extracted tree
        run: |
          rm scripts/phase-final-extract-calendar-contracts.py
          rm .github/workflows/phase-final-calendar-contracts-transform.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/main.py backend/routes/worker_calendar.py backend/routes/contracts.py scripts/phase-final-extract-calendar-contracts.py .github/workflows/phase-final-calendar-contracts-transform.yml
          git commit -m 'refactor: extract worker calendar and contracts from main'
          git push origin HEAD:refactor/main-monolith-phase-6
