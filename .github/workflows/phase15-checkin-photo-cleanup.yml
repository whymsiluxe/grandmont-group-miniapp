name: Phase 15 checkin photo cleanup

on:
  push:
    branches:
      - fix/checkin-photo-orphans-phase-15
    paths:
      - .github/workflows/phase15-checkin-photo-cleanup.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/checkin-photo-orphans-phase-15
      - name: Clean uploaded photos on metadata commit failure
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/routes/checkin.py')
          text = path.read_text()

          start_old = """                items.append(entry)\n                deps.save_checkin_meta(items)\n\n        if existing_entry is None and photo_paths:\n"""
          start_new = """                items.append(entry)\n                try:\n                    deps.save_checkin_meta(items)\n                except Exception:\n                    # Photo files are written before the metadata commit so async\n                    # file I/O stays outside checkin_lock. Atomic JSON persistence\n                    # has no fallible step after os.replace; therefore an exception\n                    # here means the new session was not committed and these files\n                    # are safe to remove.\n                    deps.cleanup_checkin_photo_files(photo_paths)\n                    deps.idempotency_release(idempotency_key, idempotency_scope)\n                    raise\n\n        if existing_entry is None and photo_paths:\n"""
          assert start_old in text
          text = text.replace(start_old, start_new, 1)

          finish_old = """            session['pending_execution_report'] = daily_plan_report.strip() or None\n            deps.save_checkin_meta(items)\n\n        # Apply daily plan execution report via durable outbox.\n"""
          finish_new = """            session['pending_execution_report'] = daily_plan_report.strip() or None\n            try:\n                deps.save_checkin_meta(items)\n            except Exception:\n                # Same ordering as Start: finish photos exist before the atomic\n                # metadata write. If that write fails, finish_at was not committed,\n                # so retain no unreferenced binaries and release the claim for retry.\n                deps.cleanup_checkin_photo_files(photo_paths)\n                deps.idempotency_release(idempotency_key, idempotency_scope)\n                raise\n\n        # Apply daily plan execution report via durable outbox.\n"""
          assert finish_old in text
          text = text.replace(finish_old, finish_new, 1)
          path.write_text(text)
          PY
          python -m py_compile backend/routes/checkin.py
      - name: Remove one-shot workflow
        run: rm .github/workflows/phase15-checkin-photo-cleanup.yml
      - name: Commit hardening
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/routes/checkin.py .github/workflows/phase15-checkin-photo-cleanup.yml
          git commit -m 'Clean checkin photos on metadata write failure [phase15]'
          git push origin HEAD:fix/checkin-photo-orphans-phase-15
