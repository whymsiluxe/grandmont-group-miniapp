name: Phase 3 commercial helper one-shot wiring

on:
  push:
    branches:
      - refactor/main-monolith-phase-3

permissions:
  contents: write

jobs:
  transform:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/main-monolith-phase-3
          fetch-depth: 1
      - name: Apply late-bound helper wiring
        run: python scripts/_phase3_late_bind_commercial_helpers.py
      - name: Commit transformed tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: keep commercial helper aliases patchable"
          git push origin HEAD:refactor/main-monolith-phase-3
