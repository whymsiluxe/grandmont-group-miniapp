name: Phase 22 guarded patch
on:
  push:
    branches:
      - fix/manual-time-idempotency-phase-22
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/manual-time-idempotency-phase-22
          fetch-depth: 0
      - name: Apply exact guarded patch
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('backend/routes/execution.py')
          s = p.read_text()
          old = 'import base64\nimport json\nimport os\n'
          new = 'import base64\nimport json\nimport logging\nimport os\n'
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)

          marker = "MANUAL_TIME_ART_WHITELIST = {'Arbeitszeit', 'Fahrzeit'}\n"
          replacement = "logger = logging.getLogger(__name__)\n\n\nMANUAL_TIME_ART_WHITELIST = {'Arbeitszeit', 'Fahrzeit'}\n"
          assert s.count(marker) == 1, s.count(marker)
          s = s.replace(marker, replacement, 1)

          old_tail = '''            if existing_entry is None:\n                deps.write_zeiterfassung_row(entry, entry['object_id'], target_user_id)\n            deps.idempotency_save(idempotency_key, entry, idempotency_scope)\n        except Exception:\n            deps.idempotency_release(idempotency_key, idempotency_scope)\n            raise\n        return entry\n'''
          new_tail = '''            if existing_entry is None:\n                deps.write_zeiterfassung_row(entry, entry['object_id'], target_user_id)\n        except Exception:\n            deps.idempotency_release(idempotency_key, idempotency_scope)\n            raise\n\n        # The manual-time business fact is already durable in checkin_meta here.\n        # The idempotency response store is a secondary replay cache; failure must\n        # not turn a committed time entry into a false 500/retry loop.\n        try:\n            deps.idempotency_save(idempotency_key, entry, idempotency_scope)\n        except Exception:\n            logger.exception(\n                'Manual-time idempotency response persistence failed after durable commit: key=%s',\n                idempotency_key,\n            )\n        return entry\n'''
          assert s.count(old_tail) == 1, s.count(old_tail)
          s = s.replace(old_tail, new_tail, 1)
          p.write_text(s)

          p = Path('tests/test_checkin_manual_idempotency.py')
          s = p.read_text()
          old_comment = '''    def test_manual_time_survives_crash_between_business_write_and_idempotency_save(self):\n        # F03 (owner review commit db584ac, CHANGES REQUIRED): simulate the exact\n        # crash window the owner described -- business fact written to\n        # checkin_meta.json, but the process dies BEFORE _idempotency_save() runs\n        # (so the durable checkin_idempotency.json entry is stuck at state=pending\n        # forever, and after _IDEMPOTENCY_TTL a bare retry would previously create\n        # a SECOND manual entry). We force this by making _idempotency_save raise,\n        # which reproduces "process died right there" for the purposes of this test.\n'''
          new_comment = '''    def test_manual_time_survives_crash_between_business_write_and_idempotency_save(self):\n        # Phase 22 strengthens the old F03 crash-window contract: once the manual\n        # time entry is durable in checkin_meta.json, failure of the secondary\n        # idempotency response store must NOT turn the request into a false 500.\n        # A retry with the same key must still resolve the same deterministic entry.\n'''
          assert s.count(old_comment) == 1, s.count(old_comment)
          s = s.replace(old_comment, new_comment, 1)

          old_call = '''        with patch.object(backend, '_cached_get_used_range', return_value=self._object_rows()), \\\n             patch.object(backend, '_write_zeiterfassung_row'), \\\n             patch.object(backend, '_idempotency_save', side_effect=RuntimeError('simulated crash')):\n            with self.assertRaises(RuntimeError):\n                backend.checkin_manual(_manual_body(), user=WORKER, role='worker', idempotency_key='manual-crash')\n'''
          new_call = '''        with patch.object(backend, '_cached_get_used_range', return_value=self._object_rows()), \\\n             patch.object(backend, '_write_zeiterfassung_row'), \\\n             patch.object(backend, '_idempotency_save', side_effect=RuntimeError('simulated crash')):\n            first = backend.checkin_manual(\n                _manual_body(), user=WORKER, role='worker', idempotency_key='manual-crash'\n            )\n'''
          assert s.count(old_call) == 1, s.count(old_call)
          s = s.replace(old_call, new_call, 1)

          marker = '''        crashed_entry_id = items_after_crash[0]['id']\n\n        with patch.object(backend, '_cached_get_used_range', return_value=self._object_rows()), \\\n'''
          replacement = '''        crashed_entry_id = items_after_crash[0]['id']\n        self.assertEqual(first['id'], crashed_entry_id)\n\n        with patch.object(backend, '_cached_get_used_range', return_value=self._object_rows()), \\\n'''
          assert s.count(marker) == 1, s.count(marker)
          s = s.replace(marker, replacement, 1)
          p.write_text(s)
          PY
          python -m py_compile backend/routes/execution.py tests/test_checkin_manual_idempotency.py
          rm .github/workflows/phase22-patch.yml
          git diff --check
      - name: Commit guarded result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/routes/execution.py tests/test_checkin_manual_idempotency.py .github/workflows/phase22-patch.yml
          git commit -m 'Harden manual-time post-commit idempotency [phase22]'
          git push origin HEAD:fix/manual-time-idempotency-phase-22
