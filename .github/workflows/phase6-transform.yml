name: Phase 6 transform
on:
  push:
    branches:
      - refactor/main-monolith-phase-6
    paths:
      - 'tools/phase6_transform.py'
      - '.github/workflows/phase6-transform.yml'

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-24.04
    env:
      BOT_TOKEN: ci-dummy-token-not-a-real-secret
      MINIAPP_DATA_ROOT: /tmp/phase6-miniapp-data
      GRANDMONT_GROUP_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/main-monolith-phase-6
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install -r requirements-test.txt
      - name: Apply extraction
        run: python tools/phase6_transform.py
      - name: Verify focused tests
        run: |
          python -m py_compile backend/main.py backend/routes/needs.py tests/test_phase6_needs_contract.py
          cd tests
          python -m pytest -q \
            test_phase6_needs_contract.py \
            test_needs_access_control.py \
            test_needs_workflow.py \
            test_tasks_deadlock_fix.py \
            test_my_tasks_frontend_contract.py \
            test_needs_ios_frontend_contract.py
      - name: Commit clean result
        run: |
          rm -f tools/phase6_transform.py .github/workflows/phase6-transform.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: wire needs domain extraction'
          git push origin HEAD:refactor/main-monolith-phase-6
