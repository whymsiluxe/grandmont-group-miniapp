name: Phase 11 checkin access service wiring

on:
  push:
    branches:
      - refactor/checkin-service-phase-11

permissions:
  contents: write

jobs:
  wire:
    if: contains(github.event.head_commit.message, '[phase11-access-wire]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/checkin-service-phase-11
          fetch-depth: 0
      - name: Wire framework-agnostic check-in access service
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path('backend/routes/checkin.py')
          src = path.read_text()

          pkg = '    from ..core.media_paths import resolve_owned_media_path\n'
          flat = '    from core.media_paths import resolve_owned_media_path  # noqa: E402\n'
          if pkg not in src or flat not in src:
              raise SystemExit('media import marker missing')
          src = src.replace(
              pkg,
              pkg + '    from ..services.checkin_access import CheckinAccessDeps, CheckinAccessError, CheckinAccessService\n',
              1,
          )
          src = src.replace(
              flat,
              flat + '    from services.checkin_access import CheckinAccessDeps, CheckinAccessError, CheckinAccessService  # noqa: E402\n',
              1,
          )

          marker = 'def create_checkin_router(deps: CheckinRouteDeps):\n    router = APIRouter()\n'
          if marker not in src:
              raise SystemExit('router marker missing')
          setup = textwrap.dedent('''
          def create_checkin_router(deps: CheckinRouteDeps):
              router = APIRouter()
              access_service = CheckinAccessService(CheckinAccessDeps(
                  checkin_lock=deps.checkin_lock,
                  load_meta=deps.load_checkin_meta,
                  save_meta=deps.save_checkin_meta,
                  photo_base=deps.checkin_photo_base,
                  resolve_media_path=resolve_owned_media_path,
                  now_timestamp=lambda: int(time.time()),
              ))

              def call_access(method, *args, **kwargs):
                  try:
                      return method(*args, **kwargs)
                  except CheckinAccessError as exc:
                      raise HTTPException(exc.status_code, exc.detail) from exc
          ''').lstrip()
          src = src.replace(marker, setup, 1)

          def replace_region(start_marker, end_marker, block):
              global src
              start = src.index(start_marker)
              end = src.index(end_marker, start)
              src = src[:start] + textwrap.dedent(block).lstrip() + '\n\n' + src[end:]

          replace_region(
              '    @router.post("/api/checkin/{session_id}/pause")',
              '    @router.post("/api/checkin/{session_id}/finish")',
              '''
              @router.post("/api/checkin/{session_id}/pause")
              def checkin_pause(session_id: str, action: str = Query(''), user: dict = Depends(deps.get_current_user), role: str = Depends(deps.get_role)):
                  return call_access(access_service.pause_session, session_id, action, str(user['id']), role)
              ''',
          )
          replace_region(
              '    @router.get("/api/checkin")',
              '    @router.get("/api/checkin/{session_id}/finish-context")',
              '''
              @router.get("/api/checkin")
              def list_checkins(object_id: str = '', date: str = '', user: dict = Depends(deps.get_current_user), role: str = Depends(deps.get_role)):
                  return access_service.list_sessions(str(user['id']), role, object_id, date)
              ''',
          )
          replace_region(
              '    @router.get("/api/checkin/{session_id}/finish-context")',
              '    @router.get("/api/checkin/{session_id}/photo/{which}/{index}")',
              '''
              @router.get("/api/checkin/{session_id}/finish-context")
              def checkin_finish_context(session_id: str, user: dict = Depends(deps.get_current_user), role: str = Depends(deps.get_role)):
                  session = call_access(access_service.get_accessible_session, session_id, str(user['id']), role)
                  return _build_finish_context(session)
              ''',
          )
          replace_region(
              '    @router.get("/api/checkin/{session_id}/photo/{which}/{index}")',
              '    handlers = SimpleNamespace(',
              '''
              @router.get("/api/checkin/{session_id}/photo/{which}/{index}")
              def get_checkin_photo(session_id: str, which: str, index: int, user: dict = Depends(deps.get_current_user), role: str = Depends(deps.get_role)):
                  path = call_access(access_service.photo_path, session_id, which, index, str(user['id']), role)
                  return FileResponse(path)
              ''',
          )

          path.write_text(src)
          PY
          python -m py_compile backend/routes/checkin.py backend/services/checkin_access.py tests/test_checkin_access_service_phase11.py
          rm .github/workflows/phase11-checkin-access-wire.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/routes/checkin.py .github/workflows/phase11-checkin-access-wire.yml
          git commit -m "Wire check-in access service [phase11]"
          git push origin HEAD:refactor/checkin-service-phase-11
