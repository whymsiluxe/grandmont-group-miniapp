name: Phase 1 route debug

on:
  push:
    branches:
      - refactor/main-monolith-phase-1
    paths:
      - .github/workflows/phase1-route-debug.yml

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/main-monolith-phase-1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-test.txt
      - name: Print fresh import route state
        env:
          BOT_TOKEN: ci-dummy-token-not-a-real-secret
          MINIAPP_DATA_ROOT: /tmp/phase1-debug-data
        run: |
          python - <<'PY'
          import os, sys
          backend_dir = os.path.abspath('backend')
          sys.path.insert(0, backend_dir)
          import main as backend
          print('backend-file=', backend.__file__)
          print('backend-package=', backend.__package__)
          print('route-count=', len(backend.app.routes))
          print('tools-router-count=', len(backend._tools_router.routes))
          print('absence-router-count=', len(backend._absence_router.routes))
          for route in backend.app.routes:
              path = getattr(route, 'path', None)
              if path and ('tools' in path or 'abwesenheit' in path):
                  print('route=', sorted(getattr(route, 'methods', set())), path, getattr(route, 'name', None))
          PY
