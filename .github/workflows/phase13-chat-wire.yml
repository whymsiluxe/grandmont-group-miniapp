name: Phase 13 chat wiring

on:
  push:
    branches:
      - refactor/chat-consistency-phase-13
    paths:
      - .github/workflows/phase13-chat-wire.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/chat-consistency-phase-13
      - name: Wire chat storage service
        run: |
          python - <<'PY'
          from pathlib import Path

          chat = Path('backend/routes/chat.py')
          text = chat.read_text()

          marker = "from fastapi import APIRouter, Depends, File, Form, HTTPException, UploadFile\n"
          addition = marker + "\ntry:\n    from ..services.chat_storage import ChatStorageDeps, ChatStorageService\nexcept ImportError:\n    from services.chat_storage import ChatStorageDeps, ChatStorageService  # noqa: E402\n"
          assert marker in text and 'ChatStorageService' not in text
          text = text.replace(marker, addition, 1)

          old = """    post_chat_attachment: Callable[..., dict]\n\n\ndef create_chat_router(deps: ChatRouteDeps) -> tuple[APIRouter, ChatHandlers]:\n    router = APIRouter()\n    chat_lock = threading.Lock()\n    os.makedirs(deps.chat_attach_dir(), exist_ok=True)\n\n    def archive_chat_messages(messages: list):\n        if not messages:\n            return\n        archive = deps.safe_load_json(deps.chat_archive_file(), [])\n        archive.extend(messages)\n        deps.atomic_write_json(deps.chat_archive_file(), archive)\n\n    def load_chat() -> list:\n        return deps.safe_load_json(deps.chat_file(), [])\n\n    def save_chat(messages: list):\n        if len(messages) > deps.chat_max:\n            archive_chat_messages(messages[:-deps.chat_max])\n            messages = messages[-deps.chat_max:]\n        deps.atomic_write_json(deps.chat_file(), messages)\n\n    def purge_old_chat(messages: list) -> list:\n        cutoff = time.time() - deps.chat_retention_seconds\n        keep = [m for m in messages if m.get('ts', 0) >= cutoff]\n        expired = [m for m in messages if m.get('ts', 0) < cutoff]\n        if expired:\n            archive_chat_messages(expired)\n        return keep\n"""
          new = """    post_chat_attachment: Callable[..., dict]\n    delete_messages_by_ids: Callable[[set[str]], int]\n\n\ndef create_chat_router(deps: ChatRouteDeps) -> tuple[APIRouter, ChatHandlers]:\n    router = APIRouter()\n    storage = ChatStorageService(\n        ChatStorageDeps(\n            safe_load_json=deps.safe_load_json,\n            atomic_write_json=deps.atomic_write_json,\n            chat_file=deps.chat_file,\n            chat_archive_file=deps.chat_archive_file,\n            chat_reactions_file=deps.chat_reactions_file,\n            chat_attach_dir=deps.chat_attach_dir,\n            chat_max=deps.chat_max,\n            chat_retention_seconds=deps.chat_retention_seconds,\n        )\n    )\n    chat_lock = storage.lock\n    archive_chat_messages = storage.archive_messages\n    load_chat = storage.load_chat\n    save_chat = storage.save_chat\n    purge_old_chat = storage.purge_old_chat\n"""
          assert old in text
          text = text.replace(old, new, 1)

          old = """        with open(os.path.join(deps.chat_attach_dir(), filename), 'wb') as output:\n            output.write(data)\n\n        message = {\n"""
          new = """        message = {\n"""
          assert old in text
          text = text.replace(old, new, 1)

          old = """        with chat_lock:\n            messages = load_chat()\n            messages.append(message)\n            save_chat(messages)\n        return {'message': message}\n\n    return router, ChatHandlers(\n"""
          new = """        storage.persist_attachment_and_message(\n            filename=filename,\n            data=data,\n            message=message,\n        )\n        return {'message': message}\n\n    return router, ChatHandlers(\n"""
          assert old in text
          text = text.replace(old, new, 1)

          old = """        mark_chat_read=mark_chat_read,\n        post_chat_attachment=post_chat_attachment,\n    )\n"""
          new = """        mark_chat_read=mark_chat_read,\n        post_chat_attachment=post_chat_attachment,\n        delete_messages_by_ids=storage.delete_messages_by_ids,\n    )\n"""
          assert old in text
          text = text.replace(old, new, 1)
          chat.write_text(text)

          actions = Path('backend/routes/chat_actions.py')
          text = actions.read_text()
          old = """        with core.chat_lock:\n            messages = core.load_chat()\n            target = next((m for m in messages if m['id'] == msg_id), None)\n            if target is None:\n                raise HTTPException(404, 'Сообщение не найдено')\n            if role != 'owner' and target['user_id'] != user['id']:\n                raise HTTPException(403, 'Можно удалять только свои сообщения')\n            messages = [m for m in messages if m['id'] != msg_id]\n            core.save_chat(messages)\n        core.archive_chat_messages([target])\n        reactions = core.load_chat_reactions()\n        remaining = [r for r in reactions if r['message_id'] != msg_id]\n        if len(remaining) != len(reactions):\n            core.save_chat_reactions(remaining)\n        return {'status': 'ok'}\n"""
          new = """        with core.chat_lock:\n            messages = core.load_chat()\n            target = next((m for m in messages if m['id'] == msg_id), None)\n            if target is None:\n                raise HTTPException(404, 'Сообщение не найдено')\n            if role != 'owner' and target['user_id'] != user['id']:\n                raise HTTPException(403, 'Можно удалять только свои сообщения')\n        deleted = core.delete_messages_by_ids({msg_id})\n        if not deleted:\n            raise HTTPException(404, 'Сообщение не найдено')\n        return {'status': 'ok'}\n"""
          assert old in text
          text = text.replace(old, new, 1)

          old = """        with core.chat_lock:\n            messages = core.load_chat()\n            if thread_key:\n                to_delete = [m for m in messages if m.get('thread_key') == thread_key]\n                remaining = [m for m in messages if m.get('thread_key') != thread_key]\n            else:\n                core.reject_self_chat(user['id'], with_)\n                core.validate_dm_recipient(with_)\n                target_thread_id = core.chat_thread_id(user['id'], with_)\n                to_delete = [\n                    m for m in messages\n                    if not m.get('thread_key')\n                    and core.chat_thread_id(m.get('user_id'), m.get('to_user_id')) == target_thread_id\n                ]\n                deleted_ids = {m['id'] for m in to_delete}\n                remaining = [m for m in messages if m['id'] not in deleted_ids]\n            core.save_chat(remaining)\n        core.archive_chat_messages(to_delete)\n        deleted_ids = {m['id'] for m in to_delete}\n        reactions = core.load_chat_reactions()\n        remaining_reactions = [r for r in reactions if r['message_id'] not in deleted_ids]\n        if len(remaining_reactions) != len(reactions):\n            core.save_chat_reactions(remaining_reactions)\n        return {'status': 'ok', 'deleted_count': len(to_delete)}\n"""
          new = """        with core.chat_lock:\n            messages = core.load_chat()\n            if thread_key:\n                to_delete = [m for m in messages if m.get('thread_key') == thread_key]\n            else:\n                core.reject_self_chat(user['id'], with_)\n                core.validate_dm_recipient(with_)\n                target_thread_id = core.chat_thread_id(user['id'], with_)\n                to_delete = [\n                    m for m in messages\n                    if not m.get('thread_key')\n                    and core.chat_thread_id(m.get('user_id'), m.get('to_user_id')) == target_thread_id\n                ]\n        deleted_ids = {str(m['id']) for m in to_delete}\n        deleted_count = core.delete_messages_by_ids(deleted_ids)\n        return {'status': 'ok', 'deleted_count': deleted_count}\n"""
          assert old in text
          text = text.replace(old, new, 1)
          actions.write_text(text)
          PY
          python -m py_compile backend/services/chat_storage.py backend/routes/chat.py backend/routes/chat_actions.py
      - name: Remove one-shot workflow
        run: rm .github/workflows/phase13-chat-wire.yml
      - name: Commit wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/routes/chat.py backend/routes/chat_actions.py .github/workflows/phase13-chat-wire.yml
          git commit -m 'Wire chat consistency service [phase13]'
          git push origin HEAD:refactor/chat-consistency-phase-13
