name: Phase 10 test contract update

on:
  push:
    branches:
      - refactor/objects-service-phase-10

permissions:
  contents: write

jobs:
  update:
    if: contains(github.event.head_commit.message, '[phase10-test-contract-update]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/objects-service-phase-10
          fetch-depth: 0
      - name: Update tests for the service boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_core_workforce_shadow.py')
          text = path.read_text()
          old = '''        import routes.objects as objects_module

        source = inspect.getsource(objects_module)
        assert 'shadow_compare_assignments' in source
'''
          new = '''        import services.object_assignments as assignments_service_module

        source = inspect.getsource(assignments_service_module)
        assert 'shadow_compare_assignments' in source
'''
          if old not in text:
              raise SystemExit('shadow test marker not found')
          path.write_text(text.replace(old, new, 1))

          path = Path('tests/test_object_assignment_service_phase10.py')
          text = path.read_text()
          old = '''    assert "fastapi" not in lowered
    assert "pydantic" not in lowered
'''
          new = '''    assert "from fastapi" not in lowered
    assert "import fastapi" not in lowered
    assert "from pydantic" not in lowered
    assert "import pydantic" not in lowered
'''
          if old not in text:
              raise SystemExit('architecture test marker not found')
          path.write_text(text.replace(old, new, 1))

          path = Path('tests/test_object_history.py')
          text = path.read_text()
          old = '''        with self._profiles_patch(), \\
             patch.object(backend, '_load_abwesenheit', return_value=[]), \\
             patch.object(backend, '_load_roles', return_value={'10': 'worker'}):
'''
          new = '''        rows = [['ID объекта', 'Статус'], ['OBJ-1', 'В работе']]
        with self._profiles_patch(), \\
             patch.object(backend, '_load_abwesenheit', return_value=[]), \\
             patch.object(backend, '_load_roles', return_value={'10': 'worker'}), \\
             patch.object(backend, '_cached_get_used_range', return_value=rows):
'''
          if old not in text:
              raise SystemExit('history test marker not found')
          path.write_text(text.replace(old, new, 1))
          PY
          python -m py_compile tests/test_core_workforce_shadow.py tests/test_object_assignment_service_phase10.py tests/test_object_history.py
          rm .github/workflows/phase10-test-contract-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_core_workforce_shadow.py tests/test_object_assignment_service_phase10.py tests/test_object_history.py .github/workflows/phase10-test-contract-update.yml
          git commit -m "Align object tests with service boundary [phase10]"
          git push origin HEAD:refactor/objects-service-phase-10
