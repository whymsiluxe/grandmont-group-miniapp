name: Phase 7 chat transform

on:
  push:
    branches:
      - refactor/main-monolith-phase-6

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: ci-dummy-token-not-a-real-secret
      MINIAPP_DATA_ROOT: /tmp/ci-miniapp-data
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/main-monolith-phase-6
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1
          pip install -r requirements-test.txt

      - name: Apply guarded transform
        run: |
          python scripts/phase7_extract_chat.py
          python -m py_compile backend/main.py backend/routes/chat.py
          grep -q 'create_chat_router' backend/main.py
          ! grep -q '^# ---------- Team Chat ----------' backend/main.py

      - name: Full regression suite
        run: |
          cd tests
          python -m pytest . -q

      - name: Commit only verified clean result
        run: |
          rm -f scripts/phase7_extract_chat.py
          rm -f .github/workflows/phase7-chat-transform.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/main.py backend/routes/chat.py tests backend/core/paths.py backend/routes/commercial_docs.py
          git add -u scripts .github/workflows
          git commit -m 'refactor: extract chat core from main'
          git push origin HEAD:refactor/main-monolith-phase-6
