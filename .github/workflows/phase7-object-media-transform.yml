name: Phase 7 Object Media Transform

on:
  push:
    branches:
      - refactor/main-monolith-phase-7-object-media

permissions:
  contents: write

jobs:
  transform:
    if: ${{ !contains(github.event.head_commit.message, '[phase7-final]') }}
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: ci-dummy-token-not-a-real-secret
      MINIAPP_DATA_ROOT: /tmp/ci-miniapp-data
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/main-monolith-phase-7-object-media
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install system dependency
        run: sudo apt-get update && sudo apt-get install -y libmagic1

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Apply guarded transform
        run: python scripts/refactor_phase7_object_media.py

      - name: Remove one-shot transform artifacts
        run: |
          rm scripts/refactor_phase7_object_media.py
          rm .github/workflows/phase7-object-media-transform.yml

      - name: Validate syntax and Ruff
        run: |
          python -m py_compile backend/main.py backend/routes/object_media.py tests/test_phase7_object_media_contract.py
          ruff check backend/core backend/routes --select F --output-format concise

      - name: Run Phase 7 contract tests
        run: |
          cd tests
          python -m pytest test_phase7_object_media_contract.py -q

      - name: Run full Python suite
        run: |
          cd tests
          python -m pytest . -q -rs

      - name: Commit clean extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/main.py backend/routes/object_media.py tests/test_phase7_object_media_contract.py
          git add -u scripts/refactor_phase7_object_media.py .github/workflows/phase7-object-media-transform.yml
          git commit -m "Extract object media routes from main.py [phase7-final]"
          git push origin HEAD:refactor/main-monolith-phase-7-object-media
