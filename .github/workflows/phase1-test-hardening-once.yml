name: Phase 1.1 test hardening

on:
  push:
    branches:
      - refactor/main-monolith-phase-1
    paths:
      - .github/workflows/phase1-test-hardening-once.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/main-monolith-phase-1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Harden tests around real boundaries
        run: |
          python - <<'PY'
          from pathlib import Path

          workforce = Path('tests/test_core_workforce_shadow.py')
          text = workforce.read_text()
          old = '''        route = next(\n            route for route in backend.app.routes\n            if getattr(route, 'path', None) == '/api/abwesenheit'\n            and 'POST' in getattr(route, 'methods', set())\n        )\n        assert route.endpoint is backend.create_abwesenheit\n        source = inspect.getsource(route.endpoint)\n        assert 'shadow_create_absence' in source\n        tree = ast.parse(source)\n        found_try_guard = any(\n            isinstance(node, ast.Try) and 'shadow_create_absence' in ast.dump(node)\n            for node in ast.walk(tree)\n        )\n        assert found_try_guard, "registered create_abwesenheit route must guard shadow_create_absence"'''
          new = '''        import textwrap\n\n        source = textwrap.dedent(inspect.getsource(backend.create_abwesenheit))\n        assert 'shadow_create_absence' in source\n        tree = ast.parse(source)\n        found_try_guard = any(\n            isinstance(node, ast.Try) and 'shadow_create_absence' in ast.dump(node)\n            for node in ast.walk(tree)\n        )\n        assert found_try_guard, "create_abwesenheit must guard shadow_create_absence"'''
          if old not in text:
              raise SystemExit('workforce transformed block not found')
          workforce.write_text(text.replace(old, new, 1))

          for filename, class_name in [
              ('tests/test_release_audit2.py', 'AbwesenheitRedactionTests'),
              ('tests/test_release_audit3.py', 'AbwesenheitReasonRedactionTests'),
          ]:
              path = Path(filename)
              text = path.read_text()
              text = text.replace("'date_from': '2026-08-01',", "'date_from': '2099-08-01',")
              text = text.replace("'date_to': '2026-08-05',", "'date_to': '2099-08-05',")
              class_marker = f'class {class_name}(unittest.TestCase):\n'
              helper = '''    def _list_from_real_temp_store(self, user, role):\n        with tempfile.TemporaryDirectory() as td, \\\n             patch.object(backend, 'ABWESENHEIT_FILE', os.path.join(td, 'abwesenheit.json')):\n            backend._save_abwesenheit([dict(self.FULL_ENTRY)])\n            return backend.list_all_abwesenheit(user=user, role=role)\n\n'''
              full_marker = '    FULL_ENTRY = {\n'
              class_pos = text.index(class_marker)
              full_pos = text.index(full_marker, class_pos)
              # Insert helper after FULL_ENTRY dict and any EXPECTED_PUBLIC constant,
              # just before the first test method.
              first_test = text.index('    def test_', full_pos)
              if '_list_from_real_temp_store' not in text[class_pos:first_test]:
                  text = text[:first_test] + helper + text[first_test:]
              import re
              pattern = re.compile(
                  r"        with patch\.object\(backend, '_load_abwesenheit', return_value=\[dict\(self\.FULL_ENTRY\)\]\), \\\n"
                  r"             patch\.object\(backend, '_auto_close_expired_open_ended_abwesenheit'\):\n"
                  r"            result = backend\.list_all_abwesenheit\(user=(WORKER_A|WORKER_B|OWNER), role='(worker|owner)'\)"
              )
              text, count = pattern.subn(
                  lambda m: f"        result = self._list_from_real_temp_store(user={m.group(1)}, role='{m.group(2)}')",
                  text,
              )
              if count != 3:
                  raise SystemExit(f'{filename}: expected 3 redaction mock blocks, replaced {count}')
              path.write_text(text)

          contract = Path('tests/test_phase1_route_contract.py')
          contract.write_text('''"""Contract guard for domains extracted from backend/main.py in Phase 1.\n\nRuns against a fresh Python interpreter so unrelated tests cannot mutate the\nFastAPI app object and invalidate the contract probe.\n"""\nimport os\nimport subprocess\nimport sys\nimport textwrap\n\nsys.path.insert(0, os.path.join(os.path.dirname(__file__), '..', 'backend'))\nimport main as backend  # noqa: E402\n\n\nPROBE = r\"\"\"\nimport os\nimport sys\nsys.path.insert(0, {backend_dir!r})\nimport main as backend\n\nROUTES = [\n    ('GET', '/api/tools', 'list_tools', ('user',)),\n    ('GET', '/api/tools/{{serial}}/history', 'tool_history', ('user',)),\n    ('GET', '/api/tools/bookings', 'list_tool_bookings', ('user',)),\n    ('POST', '/api/tools/{{serial}}/bookings', 'create_tool_booking', ('user', 'role')),\n    ('DELETE', '/api/tools/{{serial}}/bookings/{{booking_id}}', 'cancel_tool_booking', ('user', 'role')),\n    ('PATCH', '/api/tools/{{serial}}/checkout', 'checkout_tool', ('user',)),\n    ('PATCH', '/api/tools/{{serial}}/return', 'return_tool', ('user', 'role')),\n    ('PATCH', '/api/tools/{{serial}}', 'update_tool', ('user', 'owner')),\n    ('POST', '/api/tools', 'create_tool', ('user', 'owner')),\n    ('POST', '/api/abwesenheit', 'create_abwesenheit', ('user',)),\n    ('PATCH', '/api/abwesenheit/{{entry_id}}/close', 'close_abwesenheit', ('user', 'role')),\n    ('PATCH', '/api/abwesenheit/{{entry_id}}/status', 'update_abwesenheit_status', ('user', 'owner')),\n    ('PATCH', '/api/abwesenheit/{{entry_id}}', 'update_abwesenheit_dates', ('user', 'role')),\n    ('GET', '/api/abwesenheit', 'list_my_abwesenheit', ('user',)),\n    ('GET', '/api/abwesenheit/all', 'list_all_abwesenheit', ('user', 'role')),\n    ('DELETE', '/api/abwesenheit/{{entry_id}}', 'delete_abwesenheit', ('user', 'role')),\n]\n\ndependency_map = {{\n    'user': backend.get_current_user,\n    'role': backend.get_role,\n    'owner': backend.require_owner,\n}}\n\nfor method, path, handler_name, dependency_keys in ROUTES:\n    matches = [\n        route for route in backend.app.routes\n        if getattr(route, 'path', None) == path\n        and method in getattr(route, 'methods', set())\n    ]\n    assert len(matches) == 1, (method, path, len(matches))\n    route = matches[0]\n    handler = getattr(backend, handler_name)\n    assert route.endpoint is handler, (method, path, route.endpoint, handler)\n    assert route.name == handler_name, (method, path, route.name, handler_name)\n    actual_dependencies = {{dependency.call for dependency in route.dependant.dependencies}}\n    expected_dependencies = {{dependency_map[key] for key in dependency_keys}}\n    assert expected_dependencies <= actual_dependencies, (method, path)\n\nextracted = {{(method, path) for method, path, *_ in ROUTES}}\nseen = {{}}\nfor route in backend.app.routes:\n    path = getattr(route, 'path', None)\n    for method in getattr(route, 'methods', set()):\n        key = (method, path)\n        if key in extracted:\n            seen[key] = seen.get(key, 0) + 1\nassert seen == {{key: 1 for key in extracted}}, seen\nprint('phase1-route-contract-ok', len(ROUTES))\n\"\"\"\n\n\ndef test_phase1_route_contract_in_clean_process():\n    code = PROBE.format(backend_dir=os.path.dirname(backend.__file__))\n    result = subprocess.run(\n        [sys.executable, '-c', code],\n        text=True,\n        capture_output=True,\n        env=os.environ.copy(),\n        check=False,\n    )\n    assert result.returncode == 0, result.stdout + result.stderr\n    assert 'phase1-route-contract-ok 16' in result.stdout\n''')

          Path('.github/workflows/phase1-test-hardening-once.yml').unlink()
          PY
      - name: Install test dependencies
        run: pip install -r requirements-test.txt
      - name: Run affected tests before commit
        env:
          BOT_TOKEN: ci-dummy-token-not-a-real-secret
          MINIAPP_DATA_ROOT: /tmp/phase1-test-data
        run: |
          pytest -q tests/test_core_workforce_shadow.py tests/test_release_audit2.py tests/test_release_audit3.py tests/test_phase1_route_contract.py
      - name: Commit tested hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: harden extracted route contracts"
          git push origin HEAD:refactor/main-monolith-phase-1
