name: Phase 10 objects route rewrite

on:
  push:
    branches:
      - refactor/objects-service-phase-10

permissions:
  contents: write

jobs:
  rewrite:
    if: contains(github.event.head_commit.message, '[phase10-route-rewrite]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/objects-service-phase-10
          fetch-depth: 0
      - name: Rewrite assignment handlers as service adapters
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/routes/objects.py')
          src = path.read_text()

          src = src.replace(
              '    from ..core.constants import VALID_OBJECT_STATUSES\n',
              '    from ..core.constants import VALID_OBJECT_STATUSES\n'
              '    from ..services.object_assignments import (\n'
              '        ObjectAssignmentDeps, ObjectAssignmentError, ObjectAssignmentService,\n'
              '    )\n',
              1,
          )
          src = src.replace(
              '    from core.constants import VALID_OBJECT_STATUSES  # noqa: E402\n',
              '    from core.constants import VALID_OBJECT_STATUSES  # noqa: E402\n'
              '    from services.object_assignments import (  # noqa: E402\n'
              '        ObjectAssignmentDeps, ObjectAssignmentError, ObjectAssignmentService,\n'
              '    )\n',
              1,
          )

          needle = 'def create_objects_router(deps: ObjectsRouteDeps):\n    router = APIRouter()\n'
          replacement = '''def create_objects_router(deps: ObjectsRouteDeps):
              router = APIRouter()
              assignment_service = ObjectAssignmentService(ObjectAssignmentDeps(
                  cached_get_used_range=deps.cached_get_used_range,
                  load_assignments=deps.load_assignments,
                  load_worker_profiles=deps.load_worker_profiles,
                  load_abwesenheit=deps.load_abwesenheit,
                  load_roles=deps.load_roles,
                  load_checkin_meta=deps.load_checkin_meta,
                  update_json_transaction=deps.update_json_transaction,
                  object_assignments_file=deps.object_assignments_file,
                  validate_date_str=deps.validate_date_str,
                  dates_overlap=deps.dates_overlap,
                  assignment_periods_overlap=deps.assignment_periods_overlap,
                  assignment_status=deps.assignment_status,
                  utcnow_iso=deps.utcnow_iso,
                  sanitize_display_name=deps.sanitize_display_name,
                  object_history_worker_name=deps.object_history_worker_name,
                  append_object_history_best_effort=deps.append_object_history_best_effort,
                  shadow_compare_assignments=deps.shadow_compare_assignments,
                  get_work_type=wt.get_work_type,
                  skill_display_name=pskills.skill_display_name,
                  build_candidates=amatch.build_candidates,
                  new_id=lambda: uuid.uuid4().hex,
              ))

              def call_assignment(method, *args, **kwargs):
                  try:
                      return method(*args, **kwargs)
                  except ObjectAssignmentError as exc:
                      raise HTTPException(exc.status_code, exc.detail) from exc
          '''
          replacement = '\n'.join(line[12:] if line.startswith('            ') else line for line in replacement.splitlines()) + '\n'
          if needle not in src:
              raise SystemExit('create_objects_router marker not found')
          src = src.replace(needle, replacement, 1)

          def replace_block(start: str, end: str, block: str):
              global src
              left = src.find(start)
              if left < 0:
                  raise SystemExit(f'start marker not found: {start}')
              right = src.find(end, left)
              if right < 0:
                  raise SystemExit(f'end marker not found: {end}')
              src = src[:left] + block.rstrip() + '\n\n' + src[right:]

          replace_block(
              '    @router.get("/api/my-assignments")',
              '    @router.get("/api/objects/{object_id}/history")',
              '''    @router.get("/api/my-assignments")
              def my_assignments(user: dict = Depends(deps.get_current_user)):
                  return call_assignment(assignment_service.my_assignments, str(user['id']))'''.replace('              ', '    '),
          )
          replace_block(
              '    @router.post("/api/objects/{object_id}/assign")',
              '    @router.delete("/api/objects/{object_id}/assign/{user_id}")',
              '''    @router.post("/api/objects/{object_id}/assign")
              def assign_user(object_id: str, body: AssignBody, user: dict = Depends(deps.get_current_user),
                              _: None = Depends(deps.require_owner)):
                  return call_assignment(assignment_service.assign_user, object_id, body.model_dump(), user)'''.replace('              ', '    '),
          )
          replace_block(
              '    @router.delete("/api/objects/{object_id}/assign/{user_id}")',
              '    @router.patch("/api/objects/{object_id}/assignments/{assignment_id}")',
              '''    @router.delete("/api/objects/{object_id}/assign/{user_id}")
              def unassign_user(object_id: str, user_id: str, user: dict = Depends(deps.get_current_user),
                                _: None = Depends(deps.require_owner)):
                  return call_assignment(assignment_service.unassign_user, object_id, user_id)'''.replace('              ', '    '),
          )
          replace_block(
              '    @router.patch("/api/objects/{object_id}/assignments/{assignment_id}")',
              '    @router.delete("/api/objects/{object_id}/assignments/{assignment_id}")',
              '''    @router.patch("/api/objects/{object_id}/assignments/{assignment_id}")
              def update_assignment(object_id: str, assignment_id: str, body: AssignmentUpdateBody,
                                    user: dict = Depends(deps.get_current_user), _: None = Depends(deps.require_owner)):
                  return call_assignment(
                      assignment_service.update_assignment,
                      object_id,
                      assignment_id,
                      body.model_dump(exclude_unset=True),
                  )'''.replace('              ', '    '),
          )
          replace_block(
              '    @router.delete("/api/objects/{object_id}/assignments/{assignment_id}")',
              '    @router.post("/api/objects/{object_id}/assign/{user_id}/respond")',
              '''    @router.delete("/api/objects/{object_id}/assignments/{assignment_id}")
              def delete_assignment(object_id: str, assignment_id: str,
                                    user: dict = Depends(deps.get_current_user), _: None = Depends(deps.require_owner)):
                  return call_assignment(assignment_service.delete_assignment, object_id, assignment_id)'''.replace('              ', '    '),
          )
          replace_block(
              '    @router.post("/api/objects/{object_id}/assign/{user_id}/respond")',
              '    @router.get("/api/assignment-candidates")',
              '''    @router.post("/api/objects/{object_id}/assign/{user_id}/respond")
              def respond_to_assignment(object_id: str, user_id: str, body: AssignmentRespondBody,
                                        user: dict = Depends(deps.get_current_user)):
                  if str(user['id']) != str(user_id):
                      raise HTTPException(403, "Можно отвечать только на собственное назначение")
                  return call_assignment(
                      assignment_service.respond_to_assignment,
                      object_id,
                      user_id,
                      assignment_id=body.assignment_id,
                      accept=body.accept,
                      decline_reason=body.decline_reason,
                  )'''.replace('              ', '    '),
          )
          replace_block(
              '    @router.get("/api/assignment-candidates")',
              '    @router.post("/api/objects/{object_id}/assignments/batch")',
              '''    @router.get("/api/assignment-candidates")
              def get_assignment_candidates(object_id: str, work_type_id: str, date_from: str, date_to: str,
                                            user: dict = Depends(deps.get_current_user), _: None = Depends(deps.require_owner)):
                  return call_assignment(
                      assignment_service.assignment_candidates,
                      object_id,
                      work_type_id,
                      date_from,
                      date_to,
                  )'''.replace('              ', '    '),
          )
          replace_block(
              '    @router.post("/api/objects/{object_id}/assignments/batch")',
              '    @router.get("/api/objects/{object_id}/description")',
              '''    @router.post("/api/objects/{object_id}/assignments/batch")
              def batch_assign(object_id: str, body: BatchAssignBody,
                               user: dict = Depends(deps.get_current_user), _: None = Depends(deps.require_owner)):
                  return call_assignment(assignment_service.batch_assign, object_id, body.model_dump(), user)'''.replace('              ', '    '),
          )

          # History is best-effort legacy data; malformed entries should not 500 the endpoint.
          src = src.replace(
              "        filtered = [e for e in items if str(e.get('object_id')) == str(object_id)]\n",
              "        filtered = [e for e in items if isinstance(e, dict) and str(e.get('object_id')) == str(object_id)]\n",
              1,
          )

          path.write_text(src)
          PY
          python -m py_compile backend/routes/objects.py backend/services/object_assignments.py
          rm .github/workflows/phase10-objects-route-rewrite.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/routes/objects.py .github/workflows/phase10-objects-route-rewrite.yml
          git commit -m "Wire object assignment service [phase10]"
          git push origin HEAD:refactor/objects-service-phase-10
