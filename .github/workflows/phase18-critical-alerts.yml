name: Phase 18 critical alert hardening

on:
  push:
    branches:
      - fix/critical-alert-consistency-phase-18
    paths:
      - .github/workflows/phase18-critical-alerts.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/critical-alert-consistency-phase-18
      - name: Harden critical alert persistence and media
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/routes/critical_alerts.py')
          text = path.read_text()
          text = text.replace('import os\n', 'import logging\nimport os\n', 1)
          marker = 'from pydantic import BaseModel\n\n\nclass CriticalAlertAckBody'
          replacement = """from pydantic import BaseModel\n\ntry:\n    from ..core.media_paths import resolve_owned_media_path\nexcept ImportError:\n    from core.media_paths import resolve_owned_media_path  # noqa: E402\n\n\nlogger = logging.getLogger(__name__)\n\n\nclass CriticalAlertAckBody"""
          assert marker in text
          text = text.replace(marker, replacement, 1)

          old = """        ensure_critical_alert_chat(alert, thread_id, owner_ids)\n        try:\n            deps.send_telegram_message(int(target_user_id), f'🔴 {title}')\n        except Exception:\n            pass\n        return alert\n"""
          new = """        try:\n            ensure_critical_alert_chat(alert, thread_id, owner_ids)\n        except Exception:\n            # Alert persistence is the primary durable operation. Chat delivery\n            # is secondary and must not turn a committed alert into a false 500.\n            logger.exception(\n                'Critical alert chat delivery failed after durable create',\n                extra={'alert_id': alert['id']},\n            )\n        try:\n            deps.send_telegram_message(int(target_user_id), f'🔴 {title}')\n        except Exception:\n            logger.exception(\n                'Critical alert Telegram delivery failed',\n                extra={'alert_id': alert['id']},\n            )\n        return alert\n"""
          assert old in text
          text = text.replace(old, new, 1)

          old = """            with deps.chat_lock:\n                messages = deps.load_chat()\n                messages.append(msg)\n                deps.save_chat(messages)\n        return alert\n"""
          new = """            try:\n                with deps.chat_lock:\n                    messages = deps.load_chat()\n                    messages.append(msg)\n                    deps.save_chat(messages)\n            except Exception:\n                logger.exception(\n                    'Critical alert acknowledgement chat delivery failed',\n                    extra={'alert_id': alert['id']},\n                )\n        return alert\n"""
          assert old in text
          text = text.replace(old, new, 1)

          start = text.index("    @router.post('/api/critical-alerts/{alert_id}/resolve')\n")
          end = text.index("    @router.get('/api/critical-alerts/{alert_id}/photo/{filename}')\n", start)
          new_block = '''    @router.post('/api/critical-alerts/{alert_id}/resolve')\n    def resolve_critical_alert(\n        alert_id: str,\n        resolution: str = Form(...),\n        note: str = Form(''),\n        files: list[UploadFile] = File(default=[]),\n        user: dict = Depends(deps.get_current_user),\n    ):\n        if resolution not in ('yes', 'no'):\n            raise HTTPException(400, 'resolution должен быть yes или no')\n        existing = next(\n            (alert for alert in load_critical_alerts() if alert['id'] == alert_id), None\n        )\n        if not existing:\n            raise HTTPException(404, 'Алерт не найден')\n        if existing['target_user_id'] != str(user['id']):\n            raise HTTPException(403, 'Не ваш алерт')\n\n        validated_photos = []\n        if resolution == 'yes' and files:\n            # Validate the full batch before creating a single binary.\n            for upload in files:\n                data = upload.file.read()\n                if len(data) > 8 * 1024 * 1024:\n                    raise HTTPException(400, 'Файл слишком большой (макс. 8 МБ)')\n                detected = deps.sniff_image(data)\n                if not detected:\n                    raise HTTPException(400, 'Файл должен быть изображением')\n                validated_photos.append((data, '.' + deps.allowed_image_mime_ext[detected]))\n\n        saved_photos = []\n        alert_dir = os.path.join(\n            deps.critical_alert_photo_dir(), os.path.basename(alert_id)\n        )\n\n        def cleanup_saved_photos():\n            for filename in saved_photos:\n                path = resolve_owned_media_path(\n                    deps.critical_alert_photo_dir(),\n                    os.path.join(os.path.basename(alert_id), filename),\n                )\n                if not path:\n                    continue\n                try:\n                    os.remove(path)\n                except FileNotFoundError:\n                    pass\n                except OSError:\n                    logger.exception(\n                        'Failed to clean orphan critical-alert photo',\n                        extra={'alert_id': alert_id, 'filename': filename},\n                    )\n\n        if validated_photos:\n            os.makedirs(alert_dir, exist_ok=True)\n            try:\n                for data, ext in validated_photos:\n                    filename = f'{uuid.uuid4().hex}{ext}'\n                    with open(os.path.join(alert_dir, filename), 'wb') as output:\n                        output.write(data)\n                    saved_photos.append(filename)\n            except Exception:\n                cleanup_saved_photos()\n                raise\n\n        def _mutate(items):\n            alert = next((item for item in items if item['id'] == alert_id), None)\n            if not alert:\n                raise HTTPException(404, 'Алерт не найден')\n            if alert['target_user_id'] != str(user['id']):\n                raise HTTPException(403, 'Не ваш алерт')\n            alert['resolution'] = resolution\n            alert['resolution_note'] = note.strip()[:500] or None\n            alert['resolution_photos'] = saved_photos\n            return alert\n\n        try:\n            alert = deps.update_json_transaction(deps.critical_alerts_file(), [], _mutate)\n        except Exception:\n            cleanup_saved_photos()\n            raise\n\n        roles = deps.load_roles()\n        owner_ids = [uid for uid, role in roles.items() if role == 'owner']\n        thread_id = (\n            deps.chat_thread_id(alert['target_user_id'], owner_ids[0] if owner_ids else None)\n            if owner_ids else 'group'\n        )\n        text = f\"Вопрос решён: {'да' if resolution == 'yes' else 'нет'}\"\n        if note:\n            text += f'\\n{note}'\n        if saved_photos:\n            text += f'\\n📷 {len(saved_photos)} фото'\n        msg = {\n            'id': uuid.uuid4().hex,\n            'ts': int(time.time()),\n            'user_id': user['id'],\n            'name': user.get('first_name', str(user['id'])),\n            'text': text,\n            'to_user_id': None if thread_id == 'group' else thread_id,\n            'critical_alert_id': alert['id'],\n        }\n        try:\n            with deps.chat_lock:\n                messages = deps.load_chat()\n                messages.append(msg)\n                deps.save_chat(messages)\n        except Exception:\n            # Resolution and its photo metadata are already durable. Chat is a\n            # secondary notification channel and cannot invalidate that state.\n            logger.exception(\n                'Critical alert resolution chat delivery failed',\n                extra={'alert_id': alert['id']},\n            )\n        return alert\n\n'''
          text = text[:start] + new_block + text[end:]

          old_start = text.index("    @router.get('/api/critical-alerts/{alert_id}/photo/{filename}')\n")
          old_end = text.index("    @router.get('/api/critical-alerts/pending')\n", old_start)
          new_photo = '''    @router.get('/api/critical-alerts/{alert_id}/photo/{filename}')\n    def get_critical_alert_photo(\n        alert_id: str,\n        filename: str,\n        user: dict = Depends(deps.get_current_user),\n        role: str = Depends(deps.get_role),\n    ):\n        safe_alert_id = os.path.basename(alert_id)\n        safe_filename = os.path.basename(filename)\n        if safe_alert_id != alert_id or safe_filename != filename:\n            raise HTTPException(404, 'Фото не найдено')\n        alert = next(\n            (item for item in load_critical_alerts() if item['id'] == alert_id), None\n        )\n        if not alert:\n            raise HTTPException(404, 'Фото не найдено')\n        if role != 'owner' and alert['target_user_id'] != str(user['id']):\n            raise HTTPException(403, 'Нет доступа к этому фото')\n        if safe_filename not in alert.get('resolution_photos', []):\n            raise HTTPException(404, 'Фото не найдено')\n        path = resolve_owned_media_path(\n            deps.critical_alert_photo_dir(),\n            os.path.join(safe_alert_id, safe_filename),\n        )\n        if not path or not os.path.exists(path):\n            raise HTTPException(404, 'Фото не найдено')\n        return FileResponse(path)\n\n'''
          text = text[:old_start] + new_photo + text[old_end:]
          path.write_text(text)
          PY
          python -m py_compile backend/routes/critical_alerts.py
      - name: Remove one-shot workflow
        run: rm .github/workflows/phase18-critical-alerts.yml
      - name: Commit hardening
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/routes/critical_alerts.py .github/workflows/phase18-critical-alerts.yml
          git commit -m 'Harden critical alert consistency [phase18]'
          git push origin HEAD:fix/critical-alert-consistency-phase-18
