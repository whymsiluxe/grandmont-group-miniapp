name: Phase 1 Absence Compatibility Fix

on:
  push:
    branches:
      - refactor/main-monolith-phase-1
    paths:
      - scripts/_phase1_fix_absence_compat.py
      - .github/workflows/phase1-absence-compat-fix.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: ci-dummy-token-not-a-real-secret
      MINIAPP_DATA_ROOT: /tmp/ci-miniapp-data
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/main-monolith-phase-1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply compatibility wiring
        run: python scripts/_phase1_fix_absence_compat.py

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Verify the previously failing absence tests
        run: |
          python -m py_compile backend/main.py backend/routes/absence.py
          cd tests
          python -m pytest \
            test_core_workforce_shadow.py \
            test_release_audit2.py \
            test_release_audit3.py \
            test_abwesenheit_move.py \
            -q

      - name: Commit fix and remove one-shot helpers
        run: |
          rm scripts/_phase1_fix_absence_compat.py .github/workflows/phase1-absence-compat-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/main.py scripts/_phase1_fix_absence_compat.py .github/workflows/phase1-absence-compat-fix.yml
          git commit -m 'fix: preserve absence legacy compatibility'
          git push origin HEAD:refactor/main-monolith-phase-1
