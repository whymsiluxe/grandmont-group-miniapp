name: Phase 1 Absence Extraction

on:
  push:
    branches:
      - refactor/main-monolith-phase-1
    paths:
      - scripts/_phase1_extract_absence.py
      - .github/workflows/phase1-absence-extract.yml

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: ci-dummy-token-not-a-real-secret
      MINIAPP_DATA_ROOT: /tmp/ci-miniapp-data
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/main-monolith-phase-1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply exact absence-domain extraction
        run: python scripts/_phase1_extract_absence.py

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Verify syntax and absence tests
        run: |
          python -m py_compile backend/main.py backend/routes/absence.py
          cd tests
          python -m pytest test_abwesenheit_move.py test_access_control.py test_identity_display_name_resolution.py test_home_absence_identity.py -q

      - name: Commit extracted main.py and remove one-shot helpers
        run: |
          rm scripts/_phase1_extract_absence.py .github/workflows/phase1-absence-extract.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/main.py scripts/_phase1_extract_absence.py .github/workflows/phase1-absence-extract.yml
          git commit -m 'refactor: move absence domain out of main'
          git push origin HEAD:refactor/main-monolith-phase-1
