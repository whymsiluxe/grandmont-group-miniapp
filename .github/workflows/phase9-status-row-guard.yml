name: Phase 9 status row guard updater

on:
  push:
    branches:
      - refactor/main-monolith-phase-9-stages-service

permissions:
  contents: write

jobs:
  apply-status-row-guard:
    if: github.event.head_commit.message != 'Bind status mutations to object rows [phase9]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/main-monolith-phase-9-stages-service
          fetch-depth: 0
      - name: Apply object-row guard, add regression test, remove workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path('backend/services/stages.py')
          text = service.read_text()
          old = '''        try:\n            stage_before = self.find_stage_by_row(object_id, row_num)\n        except StageServiceError:\n            stage_before = {}\n        try:\n            o.update_stage_status(row_num, status, self.deps.business_today_str())\n'''
          new = '''        stage_before = self.find_stage_by_row(object_id, row_num)\n        try:\n            o.update_stage_status(row_num, status, self.deps.business_today_str())\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one update_stage_status guard block, found {text.count(old)}')
          service.write_text(text.replace(old, new))

          tests = Path('tests/test_phase9_stages_service.py')
          test_text = tests.read_text()
          marker = 'def test_status_update_rejects_object_row_mismatch_before_mutation():'
          if marker in test_text:
              raise SystemExit('status row guard regression test already exists')
          addition = '''\n\ndef test_status_update_rejects_object_row_mismatch_before_mutation():\n    objects = FakeObjects([\n        {"object_id": "OBJ-B", "_row": 7, "ID строки этапа": "OBJ-B-S1", "Название этапа": "Other"},\n    ])\n    service, _ = build_service(objects, FakeRoadmap())\n\n    with pytest.raises(StageServiceError) as exc_info:\n        service.update_stage_status("OBJ-A", 7, "Готово", {"id": "1"})\n\n    assert exc_info.value.status_code == 404\n    assert objects.status_updates == []\n'''
          tests.write_text(test_text + addition)
          PY
          rm .github/workflows/phase9-status-row-guard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/services/stages.py tests/test_phase9_stages_service.py .github/workflows/phase9-status-row-guard.yml
          git commit -m 'Bind status mutations to object rows [phase9]'
          git push origin HEAD:refactor/main-monolith-phase-9-stages-service
