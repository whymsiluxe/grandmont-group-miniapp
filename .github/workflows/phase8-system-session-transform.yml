name: Phase 8 system-session transform

on:
  push:
    branches:
      - refactor/main-monolith-phase-8-system-session
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transform-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/main-monolith-phase-8-system-session
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Guarded transform
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/main.py')
          text = path.read_text()
          start = text.index('# 30.07 (Release-аудит Этап 6): commit SHA для /api/health')
          end = text.index('# ---------- Workforce profiles domain ----------', start)
          old = text[start:end]
          required = [
              '@app.get("/api/health")',
              '@app.get("/api/health/ready")',
              '@app.get("/api/diagnostics")',
              '@app.get("/api/me")',
              '@app.post("/api/session")',
          ]
          missing = [needle for needle in required if needle not in old]
          if missing:
              raise SystemExit(f'Phase 8 guard failed; missing direct routes: {missing}')

          new = '''# System status and identity/session routes live outside the composition root.\n# main.py only wires runtime collaborators and preserves legacy direct-call aliases.\ntry:\n    from .routes.system import SystemDeps, create_system_router\n    from .routes.session_identity import SessionIdentityDeps, create_session_identity_router\nexcept ImportError:\n    from routes.system import SystemDeps, create_system_router  # noqa: E402\n    from routes.session_identity import SessionIdentityDeps, create_session_identity_router  # noqa: E402\n\n\ndef _read_app_version() -> dict:\n    return system_status.read_app_version(APP_VERSION_FILE)\n\n\ndef _system_readiness_kwargs() -> dict:\n    return {\n        "object_photo_dir": OBJECT_PHOTO_DIR,\n        "chat_attach_dir": CHAT_ATTACH_DIR,\n        "tools_lib_path": TOOLS_LIB_PATH,\n        "mangel_lib_path": MANGEL_LIB_PATH,\n        "backend_dir": BACKEND_DIR,\n        "roles_file": ROLES_FILE,\n    }\n\n\ndef _system_diagnostics_kwargs() -> dict:\n    return {\n        "data_root": DATA_ROOT,\n        "roles_file": ROLES_FILE,\n        "sheets_cache": _sheets_cache,\n        "sheets_cache_ttl": SHEETS_CACHE_TTL,\n        "activity_alerts_file": ACTIVITY_ALERTS_FILE,\n        "news_feed_file": NEWS_FEED_FILE,\n        "chat_file": CHAT_FILE,\n        "plan_sync_state_file": PLAN_SYNC_STATE_FILE,\n        "contract_ingest_state_file": CONTRACT_INGEST_STATE_FILE,\n        "contracts_drive_folder_id": CONTRACTS_DRIVE_FOLDER_ID,\n        "app_version_file": APP_VERSION_FILE,\n        "safe_load_json": _safe_load_json,\n        "outbox_dead_letter_count": _outbox_dead_letter_count,\n    }\n\n\n_system_router, _system_handlers = create_system_router(SystemDeps(\n    get_current_user=get_current_user,\n    require_owner=require_owner,\n    health_response=system_status.health_response,\n    readiness_response=system_status.readiness_response,\n    diagnostics_response=system_status.diagnostics_response,\n    get_app_version_file=lambda: APP_VERSION_FILE,\n    get_readiness_kwargs=_system_readiness_kwargs,\n    get_diagnostics_kwargs=_system_diagnostics_kwargs,\n))\napp.include_router(_system_router)\nhealth = _system_handlers.health\nhealth_ready = _system_handlers.health_ready\ndiagnostics = _system_handlers.diagnostics\n\n\n_session_identity_router, _session_identity_handlers = create_session_identity_router(\n    SessionIdentityDeps(\n        get_current_user=get_current_user,\n        get_role=get_role,\n        create_session_token=create_session_token,\n        session_token_max_age=SESSION_TOKEN_MAX_AGE,\n    )\n)\napp.include_router(_session_identity_router)\nme = _session_identity_handlers.me\ncreate_session = _session_identity_handlers.create_session\n\n\n'''
          path.write_text(text[:start] + new + text[end:])
          PY
      - name: Install production requirements and test runner
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest
      - name: Compile extracted modules and main
        run: python -m py_compile backend/main.py backend/routes/system.py backend/routes/session_identity.py tests/test_phase8_system_session_contract.py
      - name: Run Phase 8 contract tests
        env:
          GRANDMONT_GROUP_ENV: test
          MINIAPP_DATA_ROOT: /tmp/grandmont-phase8-test
          BOT_TOKEN: test-token
        run: |
          cd tests
          python -m pytest -q test_phase8_system_session_contract.py
      - name: Run full test suite
        env:
          GRANDMONT_GROUP_ENV: test
          MINIAPP_DATA_ROOT: /tmp/grandmont-phase8-test
          BOT_TOKEN: test-token
        run: |
          cd tests
          python -m pytest . -q -rs
      - name: Commit transform and remove one-shot workflow
        run: |
          rm .github/workflows/phase8-system-session-transform.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/main.py tests/test_phase8_system_session_contract.py .github/workflows/phase8-system-session-transform.yml
          git commit -m "Extract system and session routes from main.py [phase8]"
          git push origin HEAD:refactor/main-monolith-phase-8-system-session
