name: Phase 8b photo feed transform

on:
  push:
    branches: [refactor/main-monolith-phase-6]

permissions:
  contents: write

concurrency:
  group: phase8b-photo-feed-transform
  cancel-in-progress: true

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      BOT_TOKEN: ci-dummy-token-not-a-real-secret
      MINIAPP_DATA_ROOT: /tmp/ci-miniapp-data
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/main-monolith-phase-6
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1
          pip install -r requirements-test.txt
      - name: Apply guarded transform
        run: |
          python scripts/phase8b_extract_photo_feed.py
          python -m py_compile backend/*.py backend/core/*.py backend/routes/*.py tests/*.py
          echo "main.py lines after transform: $(wc -l < backend/main.py)"
      - name: Full Python regression suite
        run: cd tests && python -m pytest . -q
      - name: Commit clean extracted tree
        run: |
          git rm scripts/phase8b_extract_photo_feed.py .github/workflows/phase8b-photo-feed-transform.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/main.py
          git commit -m 'refactor: extract photo feed from main'
          git push origin HEAD:refactor/main-monolith-phase-6
