name: CI

# Release-аудит Этап 7: минимальный набор проверок release-готовности. Работает
# ПОЛНОСТЬЮ offline -- ни одного обращения к реальным Google Sheets/Telegram API/
# production credentials. BOT_TOKEN ниже -- заглушка для теста HMAC-подписи
# (validate_init_data сверяет подпись с этим значением, не настоящим ботом),
# не production secret.
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: ci-dummy-token-not-a-real-secret
      MINIAPP_DATA_ROOT: /tmp/ci-miniapp-data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependency (libmagic for python-magic)
        run: sudo apt-get update && sudo apt-get install -y libmagic1

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Python syntax check (backend/*.py, backend/core/*.py, tests/*.py)
        run: |
          python -m py_compile backend/*.py backend/core/*.py tests/*.py

      - name: Verify backend/main.py importable in test environment
        run: |
          cd tests && python -c "
          import sys, os
          sys.path.insert(0, os.path.join(os.path.dirname('.'), '..', 'backend'))
          import main
          print('main.py imported OK, routes:', len(main.app.routes))
          "

      - name: Verify backend importable as a package (production uvicorn miniapp.main:app scenario)
        run: |
          # 01.08 (доп.раунд П1): production запускается как `uvicorn miniapp.main:app`
          # с WorkingDirectory=/home/promonta/agent -- это package-import (namespace
          # package, нет __init__.py), sys.path[0] в этом сценарии -- родительская
          # директория пакета, НЕ директория main.py. Обычный top-level `import main`
          # (шаг выше) не ловит эту разницу вообще -- собираем временный пакет
          # `miniapp/` из backend/*.py и импортируем его как package member, ровно
          # как это делает uvicorn в проде.
          rm -rf /tmp/ci-pkgtest && mkdir -p /tmp/ci-pkgtest/miniapp
          cp backend/*.py /tmp/ci-pkgtest/miniapp/
          cp -r backend/core /tmp/ci-pkgtest/miniapp/
          cp -r backend/routes /tmp/ci-pkgtest/miniapp/
          cd /tmp/ci-pkgtest && python -c "
          import sys
          sys.path.insert(0, '.')
          import miniapp.main as m
          print('package-import OK, routes:', len(m.app.routes))
          assert m.wt.__name__ == 'miniapp.work_types', m.wt.__name__
          assert m.pskills.__name__ == 'miniapp.profile_skills', m.pskills.__name__
          assert m.amatch.__name__ == 'miniapp.assignment_matching', m.amatch.__name__
          "
          rm -rf /tmp/ci-pkgtest

      - name: Check required repo files exist
        run: |
          test -f backend/tools_lib.py || (echo 'backend/tools_lib.py missing' && exit 1)
          test -f backend/mangel_lib.py || (echo 'backend/mangel_lib.py missing' && exit 1)
          test -f backend/objekte_lib.py || (echo 'backend/objekte_lib.py missing' && exit 1)
          test -f backend/roadmap_lib.py || (echo 'backend/roadmap_lib.py missing' && exit 1)
          test -f backend/work_types.py || (echo 'backend/work_types.py missing' && exit 1)
          test -f backend/profile_skills.py || (echo 'backend/profile_skills.py missing' && exit 1)
          test -f backend/assignment_matching.py || (echo 'backend/assignment_matching.py missing' && exit 1)
          test -f backend/daily_plan_lib.py || (echo 'backend/daily_plan_lib.py missing' && exit 1)
          test -f scripts/manifest.sh || (echo 'scripts/manifest.sh missing' && exit 1)
          test -f frontend/js/skill-picker.js || (echo 'frontend/js/skill-picker.js missing' && exit 1)
          test -f frontend/js/assignment-sheet.js || (echo 'frontend/js/assignment-sheet.js missing' && exit 1)
          test -f backend/angebot_free.js || (echo 'backend/angebot_free.js missing' && exit 1)
          test -f backend/rechnung.js || (echo 'backend/rechnung.js missing' && exit 1)
          test -f backend/main.py || (echo 'backend/main.py missing' && exit 1)
          test -f frontend/app.html || (echo 'frontend/app.html missing' && exit 1)
          test -f scripts/deploy.sh || (echo 'scripts/deploy.sh missing' && exit 1)
          test -f scripts/rollback.sh || (echo 'scripts/rollback.sh missing' && exit 1)
          test -f package.json || (echo 'package.json missing' && exit 1)
          test -f package-lock.json || (echo 'package-lock.json missing' && exit 1)
          echo "All required files present"

      - name: Shell syntax check (deploy/rollback scripts)
        run: |
          bash -n scripts/deploy.sh
          bash -n scripts/rollback.sh
          bash -n scripts/manifest.sh
          echo "deploy.sh/rollback.sh/manifest.sh syntax OK"

      - name: Check for unresolved merge conflict markers
        run: |
          ! grep -rE "^(<<<<<<<|=======|>>>>>>>)" --include="*.py" --include="*.js" --include="*.html" backend/ frontend/ tests/

      - name: Guard against work-type catalog duplication (01.08)
        run: |
          # 01.08 (единый каталог видов работ): backend/work_types.py -- ЕДИНСТВЕННЫЙ
          # источник истины. Раньше один и тот же список навыков был вручную продублирован
          # в main.py + 2 frontend-файлах, что дало реальный дрифт (SKILL_STAGE_MAP
          # покрывал только 8 из 19 навыков). Эта проверка ловит повторное появление
          # статичного списка ВНЕ work_types.py -- любой JS-файл с массивом из 15+
          # захардкоженных строк-навыков (тот же класс паттерна, что были ONBOARDING_GROUPS/
          # BUBBLE_STAGE_OPTIONS/SKILL_STAGE_MAP) считается регрессией.
          FOUND=0
          for f in frontend/js/*.js; do
            if grep -qE '(SKILL_OPTIONS|ONBOARDING_GROUPS|BUBBLE_STAGE_OPTIONS|SKILL_STAGE_MAP)\s*=' "$f"; then
              echo "REGRESSION: $f содержит статичный каталог навыков вместо GET /api/work-types"
              FOUND=1
            fi
          done
          if [ "$FOUND" = "1" ]; then exit 1; fi
          echo "OK: единый work-types каталог не продублирован во frontend"

      - name: Check for obvious committed secrets
        run: |
          # Ищем реальные значения секретов, не сами имена переменных (BOT_TOKEN=
          # os.environ[...] -- нормальный код, BOT_TOKEN=123456:ABC-DEF... -- утечка).
          FOUND=0
          if grep -rEn 'BOT_TOKEN\s*=\s*["\x27][0-9]+:[A-Za-z0-9_-]{30,}' backend/ frontend/ 2>/dev/null; then FOUND=1; fi
          if grep -rEn '\-\-\-\-\-BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY\-\-\-\-\-' . --exclude-dir=.git 2>/dev/null; then FOUND=1; fi
          if grep -rEn '"refresh_token"\s*:\s*"[^"]{20,}"' backend/ frontend/ 2>/dev/null; then FOUND=1; fi
          if grep -rEn '"client_secret"\s*:\s*"[^"]{10,}"' backend/ frontend/ 2>/dev/null; then FOUND=1; fi
          if [ -f backend/.sheets.json ] || [ -f .sheets.json ]; then echo "found .sheets.json in repo"; FOUND=1; fi
          if [ -f backend/roles.json ] || [ -f roles.json ]; then echo "found production roles.json in repo"; FOUND=1; fi
          if [ "$FOUND" = "1" ]; then exit 1; fi
          echo "No obvious secrets found"

      - name: Run full test suite
        run: |
          cd tests && python -m pytest . -q

      - name: JS syntax check (frontend/js/**/*.js + backend PDF scripts)
        run: |
          find frontend/js -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check backend/angebot_free.js
          node --check backend/rechnung.js
          echo "All JS files syntax-OK"

      - name: Install pdfkit via npm ci (reproducible, from package-lock.json)
        run: npm ci

      - name: pdfkit require() smoke-check
        run: node -e "require('pdfkit'); console.log('pdfkit OK')"

      - name: Notify Engineering Center on failure
        # Reuses the SAME bot/chat as every grandmont-group-*.service on the VPS
        # (see scripts/engineering-center.sh in engineering-os) -- GitHub Actions
        # can't reach /etc/claude-agent.env directly, so the same two values are
        # mirrored into this repo's Actions secrets (BOT_TOKEN_NOTIFY, CHAT_ID).
        # Named BOT_TOKEN_NOTIFY (not BOT_TOKEN) to avoid colliding with this
        # workflow's own existing dummy BOT_TOKEN env var above. No new bot.
        if: failure() && github.ref == 'refs/heads/main'
        env:
          BOT_TOKEN_NOTIFY: ${{ secrets.BOT_TOKEN_NOTIFY }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          if [ -z "$BOT_TOKEN_NOTIFY" ]; then
            echo "BOT_TOKEN_NOTIFY secret not set on this repo -- skipping Telegram notify (owner setup pending)."
            exit 0
          fi
          TEXT="🔴 <b>P1</b> ci/workflow_failure
          Resource: grandmont-group-miniapp (${{ github.ref_name }})
          Env: ci
          Run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Commit: ${{ github.sha }}"
          curl -s "https://api.telegram.org/bot${BOT_TOKEN_NOTIFY}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "parse_mode=HTML" > /dev/null
