name: Commercial Docs dead wiring cleanup

on:
  push:
    branches:
      - cleanup/commercial-dead-wiring

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: ci-dummy-token-not-a-real-secret
      MINIAPP_DATA_ROOT: /tmp/ci-miniapp-data
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependency
        run: sudo apt-get update && sudo apt-get install -y libmagic1

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Apply exact cleanup transform
        run: python scripts/commercial_dead_wiring_cleanup.py

      - name: Compile Python
        run: python -m py_compile backend/*.py backend/core/*.py backend/routes/*.py tests/*.py

      - name: Run full test suite
        run: cd tests && python -m pytest . -q -rs

      - name: Commit clean result
        run: |
          rm scripts/commercial_dead_wiring_cleanup.py .github/workflows/commercial-dead-wiring-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "cleanup: remove Commercial Docs dead wiring"
          git push origin HEAD:cleanup/commercial-dead-wiring
