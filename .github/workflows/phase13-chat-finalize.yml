name: Phase 13 chat finalize

on:
  push:
    branches:
      - refactor/chat-consistency-phase-13
    paths:
      - .github/workflows/phase13-chat-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/chat-consistency-phase-13
      - name: Finalize chat consistency wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          chat = Path('backend/routes/chat.py')
          text = chat.read_text()
          assert '\nimport os\n' in text
          text = text.replace('\nimport os\n', '\n', 1)
          chat.write_text(text)

          actions = Path('backend/routes/chat_actions.py')
          text = actions.read_text()
          old = """        thread_id = core.chat_thread_id(user['id'], body.to_user_id)\n        meta = core.load_chat_thread_meta()\n        thread_meta = meta.setdefault(thread_id, {})\n        thread_meta['closed'] = True\n        thread_meta['closed_at'] = int(time.time())\n        thread_meta['closed_by'] = str(user['id'])\n        core.save_chat_thread_meta(meta)\n        for uid in chat_thread_participants(thread_id):\n"""
          new = """        thread_id = core.chat_thread_id(user['id'], body.to_user_id)\n        with core.chat_lock:\n            meta = core.load_chat_thread_meta()\n            thread_meta = meta.setdefault(thread_id, {})\n            thread_meta['closed'] = True\n            thread_meta['closed_at'] = int(time.time())\n            thread_meta['closed_by'] = str(user['id'])\n            core.save_chat_thread_meta(meta)\n        for uid in chat_thread_participants(thread_id):\n"""
          assert old in text
          text = text.replace(old, new, 1)

          old = """        thread_id = core.chat_thread_id(user['id'], body.to_user_id)\n        meta = core.load_chat_thread_meta()\n        if thread_id in meta:\n            meta[thread_id]['closed'] = False\n            core.save_chat_thread_meta(meta)\n        return {'status': 'ok', 'thread_id': thread_id}\n"""
          new = """        thread_id = core.chat_thread_id(user['id'], body.to_user_id)\n        with core.chat_lock:\n            meta = core.load_chat_thread_meta()\n            if thread_id in meta:\n                meta[thread_id]['closed'] = False\n                core.save_chat_thread_meta(meta)\n        return {'status': 'ok', 'thread_id': thread_id}\n"""
          assert old in text
          text = text.replace(old, new, 1)
          actions.write_text(text)
          PY
          python -m py_compile backend/services/chat_storage.py backend/routes/chat.py backend/routes/chat_actions.py
      - name: Remove one-shot workflow
        run: rm .github/workflows/phase13-chat-finalize.yml
      - name: Commit final wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/routes/chat.py backend/routes/chat_actions.py .github/workflows/phase13-chat-finalize.yml
          git commit -m 'Harden chat mutation ordering [phase13]'
          git push origin HEAD:refactor/chat-consistency-phase-13
