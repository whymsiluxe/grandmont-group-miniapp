name: Phase 11 fix checkin route scope

on:
  push:
    branches:
      - refactor/checkin-service-phase-11

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, '[phase11-fix-route-scope]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/checkin-service-phase-11
          fetch-depth: 0
      - name: Restore adapter scope inside router factory
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/routes/checkin.py')
          src = path.read_text()

          def indent_region(start_marker: str, end_marker: str):
              global src
              start = src.index(start_marker)
              end = src.index(end_marker, start)
              region = src[start:end]
              if region.startswith('    '):
                  return
              region = '\n'.join(('    ' + line) if line else line for line in region.split('\n'))
              src = src[:start] + region + src[end:]

          indent_region(
              '@router.post("/api/checkin/{session_id}/pause")',
              '    @router.post("/api/checkin/{session_id}/finish")',
          )
          indent_region(
              '@router.get("/api/checkin")',
              '@router.get("/api/checkin/{session_id}/finish-context")',
          )
          indent_region(
              '@router.get("/api/checkin/{session_id}/finish-context")',
              '@router.get("/api/checkin/{session_id}/photo/{which}/{index}")',
          )
          indent_region(
              '@router.get("/api/checkin/{session_id}/photo/{which}/{index}")',
              '    handlers = SimpleNamespace(',
          )
          path.write_text(src)
          PY
          python -m py_compile backend/routes/checkin.py backend/services/checkin_access.py
          python - <<'PY'
          import ast
          from pathlib import Path

          tree = ast.parse(Path('backend/routes/checkin.py').read_text())
          factory = next(n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name == 'create_checkin_router')
          names = {
              n.name for n in factory.body
              if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))
          }
          required = {
              'checkin_start', 'checkin_pause', 'checkin_finish', 'export_stundenzettel',
              'list_checkins', 'checkin_finish_context', 'get_checkin_photo',
          }
          missing = required - names
          if missing:
              raise SystemExit(f'route handlers escaped factory scope: {sorted(missing)}')
          PY
          rm .github/workflows/phase11-fix-route-scope.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/routes/checkin.py .github/workflows/phase11-fix-route-scope.yml
          git commit -m "Restore check-in route factory scope [phase11]"
          git push origin HEAD:refactor/checkin-service-phase-11
