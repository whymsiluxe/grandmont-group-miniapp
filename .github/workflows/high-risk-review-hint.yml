name: High-risk review hint

# Detect-only soft signal (Grandmont Dev OS plan item 50). Does NOT run Codex,
# does NOT block merge, is NOT a required status check, does NOT touch branch
# protection, uses no secrets beyond the default GITHUB_TOKEN. Self-contained --
# no dependency on the private grandmont-dev-os repo at runtime.
#
# Hardening (2026-10): changed file names are untrusted input. They are read
# NUL-delimited by Python via an argv-list subprocess and are never interpolated
# into shell source or into a GitHub expression. Only fixed values (PR number,
# base branch, repo) are passed, via env. Regression test:
# grandmont-dev-os/evals/test_high_risk_hint.py
#
# High-risk paths for this repo (verified against real code):
#   - backend/core/permissions.py                      (initData HMAC verification, session tokens)
#   - backend/core/telegram.py                         (bot token, outbound sends)
#   - backend/core/(grandmont_core_client|workforce_shadow).py (Core client and worker-identity shadow)
#   - backend/routes/(auth|service_bridge|daily_plan|checkin).py (auth, CRM service bridge, DailyPlan and check-in routes)
#   - backend/daily_plan_lib.py                        (DailyPlan logic)

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  high-risk-hint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect high-risk paths and comment (non-blocking, idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys

          MARKER = "<!-- grandmont-dev-os:high-risk-codex-review -->"
          CATEGORIES = "Telegram initData / session-token auth / bot token / service bridge / DailyPlan / check-in / Core identity"
          PATTERNS = [
              r"^backend/core/permissions\.py$",
              r"^backend/core/telegram\.py$",
              r"^backend/core/(grandmont_core_client|workforce_shadow)\.py$",
              r"^backend/routes/(auth|service_bridge|daily_plan|checkin)\.py$",
              r"^backend/daily_plan_lib\.py$",
          ]

          def clean(name):
              # Printable ASCII only, no backticks: safe inside a markdown code fence.
              return re.sub(r"[^\x20-\x7e]|`", "?", name)[:200]

          def main():
              base = os.environ["BASE_REF"]
              pr = os.environ["PR_NUMBER"]
              repo = os.environ["REPO"]
              dry = os.environ.get("HRH_DRY_RUN") == "1"

              raw = subprocess.run(
                  ["git", "diff", "-z", "--name-only", "--no-renames", "origin/" + base + "...HEAD"],
                  check=True, capture_output=True,
              ).stdout
              files = [p.decode("utf-8", "surrogateescape") for p in raw.split(b"\0") if p]
              hits = sorted(p for p in files if any(re.search(rx, p) for rx in PATTERNS))
              shown = [clean(p) for p in hits[:50]]
              if len(hits) > 50:
                  shown.append("... and %d more" % (len(hits) - 50))

              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if hits:
                  text = "### High-risk paths changed\n```\n" + "\n".join(shown) + "\n```\nCodex review recommended (informational only, not blocking).\n"
              else:
                  text = "No high-risk paths changed.\n"
              print(text)
              if summary:
                  with open(summary, "a") as fh:
                      fh.write(text)

              if hits:
                  body = (
                      MARKER + "\n**High-risk change detected - Codex review recommended**\n\n"
                      "Categories: " + CATEGORIES + "\n\nFiles:\n```\n" + "\n".join(shown) + "\n```\n\n"
                      "Consider an independent review round (`codex-debate` skill, max 1-2 rounds) before merging. "
                      "This is informational only - Codex is NOT run automatically, and this check does NOT block merge."
                  )
              else:
                  body = MARKER + "\nNo current high-risk files detected in this PR."

              if dry:
                  print(json.dumps({"hits": hits, "body": body}))
                  return

              def gh(args, data=None):
                  return subprocess.run(["gh", "api"] + args, input=data, capture_output=True, text=True)

              found = gh(["--paginate", "repos/%s/issues/%s/comments" % (repo, pr), "--jq",
                          '.[] | select(.body | startswith("' + MARKER + '")) | .id'])
              existing = found.stdout.split()[0] if found.returncode == 0 and found.stdout.split() else ""
              payload = json.dumps({"body": body})
              if existing:
                  r = gh(["-X", "PATCH", "repos/%s/issues/comments/%s" % (repo, existing), "--input", "-"], payload)
              elif hits:
                  r = gh(["-X", "POST", "repos/%s/issues/%s/comments" % (repo, pr), "--input", "-"], payload)
              else:
                  return
              if r.returncode != 0:
                  print("Could not post/update comment (likely a fork PR with a read-only token) - see step summary instead.")

          try:
              main()
          except Exception as exc:  # non-blocking by design: never fail the PR over a hint
              print("high-risk hint skipped: %s" % type(exc).__name__)
          sys.exit(0)
          PY
