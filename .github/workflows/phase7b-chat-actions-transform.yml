name: Phase 7b chat actions transform

on:
  push:
    branches:
      - refactor/main-monolith-phase-6

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: ci-dummy-token-not-a-real-secret
      MINIAPP_DATA_ROOT: /tmp/ci-miniapp-data
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/main-monolith-phase-6
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1
          pip install -r requirements-test.txt
      - name: Apply guarded transform
        run: |
          python scripts/phase7b_extract_chat_actions.py
          python -m py_compile backend/main.py backend/routes/chat.py backend/routes/chat_actions.py
          grep -q 'create_chat_actions_router' backend/main.py
          ! grep -q '^@app.get("/api/chat/attachments/{fname}")' backend/main.py
      - name: Full regression suite
        run: |
          cd tests
          python -m pytest . -q
      - name: Commit only verified clean result
        run: |
          rm -f scripts/phase7b_extract_chat_actions.py
          rm -f .github/workflows/phase7b-chat-actions-transform.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/main.py backend/routes/chat.py backend/routes/chat_actions.py tests
          git add -u scripts .github/workflows
          git commit -m 'refactor: extract chat write actions from main'
          git push origin HEAD:refactor/main-monolith-phase-6
